<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Klassisches ADS-B Radar</title>
  <style>
    body {
      background-color: #050b05;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    #radarCanvas {
      background-color: #001100;
      border: 3px solid #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
    }
    .info {
      margin-top: 15px;
      font-size: 14px;
      text-shadow: 0 0 5px #00ff66;
    }
  </style>
</head>
<body>

  <h2>ATC RADAR SCOPE</h2>
  <canvas id="radarCanvas" width="600" height="600"></canvas>
  <div class="info" id="status">Lade Flugzeugdaten...</div>

  <script>
    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');

    // DEINE POSITION (Breiten- und Längengrad eintragen)
    const MY_LAT = 48.2082; // Beispiel: Wien (anpassen!)
    const MY_LON = 16.3738;
    const MAX_RANGE_KM = 100; // Radius des Schirms in Kilometern

    const CENTER_X = canvas.width / 2;
    const CENTER_Y = canvas.height / 2;
    const RADIUS = canvas.width / 2 - 10;

    let sweepAngle = 0;
    let aircraftList = [];

    // 1. Hintergrund & Radar-Ringe zeichnen
    function drawRadarScope() {
      ctx.fillStyle = 'rgba(0, 17, 0, 0.15)'; // Leichtes Nachleuchten (Fade-Effekt)
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Äußerer Kreis & Fadenkreuz
      ctx.strokeStyle = '#006622';
      ctx.lineWidth = 1;

      for (let r = 1; r <= 4; r++) {
        ctx.beginPath();
        ctx.arc(CENTER_X, CENTER_Y, (RADIUS / 4) * r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Fadenkreuz
      ctx.beginPath();
      ctx.moveTo(CENTER_X, CENTER_Y - RADIUS);
      ctx.lineTo(CENTER_X, CENTER_Y + RADIUS);
      ctx.moveTo(CENTER_X - RADIUS, CENTER_Y);
      ctx.lineTo(CENTER_X + RADIUS, CENTER_Y);
      ctx.stroke();
    }

    // 2. Rotierenden Strahl zeichnen
    function drawSweep() {
      sweepAngle += 0.03;
      if (sweepAngle >= Math.PI * 2) sweepAngle = 0;

      ctx.save();
      ctx.translate(CENTER_X, CENTER_Y);
      ctx.rotate(sweepAngle);

      // Radarstrahl mit Farbverlauf
      let gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, RADIUS);
      gradient.addColorStop(0, 'rgba(0, 255, 102, 0.8)');
      gradient.addColorStop(1, 'rgba(0, 255, 102, 0.1)');

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, RADIUS, -0.2, 0); // Fächer
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.restore();
    }

    // 3. Umrechnung von GPS-Koordinaten auf Bildschirmpixel
    function gpsToRadar(lat, lon) {
      const dLat = (lat - MY_LAT) * 111.13; // ca. 111 km pro Breitengrad
      const dLon = (lon - MY_LON) * (111.13 * Math.cos(MY_LAT * Math.PI / 180));

      const x = CENTER_X + (dLon / MAX_RANGE_KM) * RADIUS;
      const y = CENTER_Y - (dLat / MAX_RANGE_KM) * RADIUS; // Y ist auf Canvas umgekehrt
      return { x, y };
    }

    // 4. Flugzeuge als grüne Punkte & Text zeichnen
    function drawAircraft() {
      aircraftList.forEach(ac => {
        if (!ac.lat || !ac.lon) return;

        const pos = gpsToRadar(ac.lat, ac.lon);

        // Prüfen, ob das Flugzeug innerhalb des Schirms liegt
        const dist = Math.hypot(pos.x - CENTER_X, pos.y - CENTER_Y);
        if (dist <= RADIUS) {
          // Blip (Punkt)
          ctx.fillStyle = '#00ff66';
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, 4, 0, Math.PI * 2);
          ctx.fill();

          // Flugnummer & Höhe (in Fuß) als Text
          ctx.fillStyle = '#00ff66';
          ctx.font = '10px Courier New';
          const label = (ac.flight || ac.hex).trim();
          const alt = ac.alt_baro ? `${ac.alt_baro}ft` : '';
          ctx.fillText(`${label}`, pos.x + 8, pos.y);
          ctx.fillText(`${alt}`, pos.x + 8, pos.y + 10);
        }
      });
    }

    // 5. Daten vom ADS-B Empfänger laden (z.B. dump1090)
    async function fetchADSBData() {
      try {
        // Ersetze die URL mit deiner dump1090 IP-Adresse (z. B. http://192.168.1.50/dump1090/data/aircraft.json)
        const response = await fetch('http://localhost:8080/data/aircraft.json');
        const data = await response.json();
        aircraftList = data.aircraft || [];
        statusDiv.innerText = `Empfange Signale | Flugzeuge in Reichweite: ${aircraftList.length}`;
      } catch (err) {
        statusDiv.innerText = "Warte auf ADS-B Datenquelle...";
      }
    }

    // Main Loop
    function loop() {
      drawRadarScope();
      drawSweep();
      drawAircraft();
      requestAnimationFrame(loop);
    }

    // Alle 2 Sekunden Daten aktualisieren
    setInterval(fetchADSBData, 2000);
    loop();
  </script>
</body>
</html>
