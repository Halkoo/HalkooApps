<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klassisches ADS-B Radar mit Kartenmaterial</title>
  <style>
    body {
      background-color: #050b05;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    h2 {
      margin-bottom: 10px;
      text-shadow: 0 0 10px #00ff66;
      letter-spacing: 2px;
    }
    #radarCanvas {
      background-color: #001100;
      border: 4px solid #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.5);
    }
    .info {
      margin-top: 15px;
      font-size: 14px;
      text-shadow: 0 0 5px #00ff66;
      background: rgba(0, 20, 0, 0.8);
      padding: 5px 15px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h2>ATC RADAR WITH MAP OVERLAY</h2>
  <canvas id="radarCanvas" width="650" height="650"></canvas>
  <div class="info" id="status">Radar mit Grenzen & Flüssen aktiv</div>

  <script>
    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');

    const CENTER_X = canvas.width / 2;
    const CENTER_Y = canvas.height / 2;
    const RADIUS = (canvas.width / 2) - 15;

    // --- DEIN STANDORT ---
    // Hier kannst du genau deine GPS-Koordinaten eintragen:
    const MY_LAT = 47.35; // Breitengrad
    const MY_LON = 13.20; // Längengrad
    const RADAR_RANGE_KM = 80; // Sichtweite im Radar-Radius in km

    let sweepAngle = 0;

    // --- GEODATEN (GRENZEN UND FLÜSSE ALIAS KOORDINATEN-KETTEN) ---
    
    // Beispiel-Grenzverläufe (Punkte als [Lat, Lon])
    const BORDERS = [
      // Eine Beispiel-Landesgrenze
      [ [47.8, 12.8], [47.6, 13.0], [47.4, 13.1], [47.1, 12.9], [47.0, 12.5] ],
      // Eine Bezirks-/Bundeslandgrenze
      [ [47.5, 13.5], [47.3, 13.3], [47.2, 13.1], [47.0, 13.0] ]
    ];

    // Beispiel-Flüsse (Punkte als [Lat, Lon])
    const RIVERS = [
      // Ein Flusslauf
      [ [47.1, 13.1], [47.25, 13.18], [47.35, 13.20], [47.5, 13.05], [47.8, 13.0] ]
    ];

    // --- GPS IN RADAR-PIXEL UMRECHNEN ---
    function gpsToRadarPixel(lat, lon) {
      const dLat = (lat - MY_LAT) * 111.13; // ca. 111 km pro Breitengrad
      const dLon = (lon - MY_LON) * (111.13 * Math.cos(MY_LAT * Math.PI / 180));

      const x = CENTER_X + (dLon / RADAR_RANGE_KM) * RADIUS;
      const y = CENTER_Y - (dLat / RADAR_RANGE_KM) * RADIUS; // Y auf Canvas umgekehrt
      return { x, y };
    }

    // --- KARTENMATERIAL ZEICHNEN (GRENZEN & FLÜSSE) ---
    function drawMapOverlays() {
      // 1. GRENZEN ZEICHNEN (Gepunktet/Gestrichelt in Dunkelgrün)
      ctx.strokeStyle = 'rgba(0, 255, 102, 0.35)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]); // Gestrichelte Linie für Grenzen

      BORDERS.forEach(borderLine => {
        ctx.beginPath();
        borderLine.forEach((pt, index) => {
          const pos = gpsToRadarPixel(pt[0], pt[1]);
          if (index === 0) ctx.moveTo(pos.x, pos.y);
          else ctx.lineTo(pos.x, pos.y);
        });
        ctx.stroke();
      });

      // 2. FLÜSSE ZEICHNEN (Durchgezogen in leicht bläulichem/hellerem Grün)
      ctx.strokeStyle = 'rgba(0, 255, 180, 0.4)';
      ctx.lineWidth = 2;
      ctx.setLineDash([]); // Durchgezogene Linie

      RIVERS.forEach(riverLine => {
        ctx.beginPath();
        riverLine.forEach((pt, index) => {
          const pos = gpsToRadarPixel(pt[0], pt[1]);
          if (index === 0) ctx.moveTo(pos.x, pos.y);
          else ctx.lineTo(pos.x, pos.y);
        });
        ctx.stroke();
      });

      // Zurücksetzen der Linien-Formate
      ctx.setLineDash([]);
    }

    // --- RADAR RASTER & SCHIRM ---
    function drawRadarScope() {
      ctx.fillStyle = 'rgba(0, 17, 0, 0.15)'; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#004411';
      ctx.lineWidth = 1;

      // Abstandsringe (z.B. 20km, 40km, 60km, 80km)
      for (let r = 1; r <= 4; r++) {
        ctx.beginPath();
        ctx.arc(CENTER_X, CENTER_Y, (RADIUS / 4) * r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Fadenkreuz
      ctx.beginPath();
      ctx.moveTo(CENTER_X, CENTER_Y - RADIUS);
      ctx.lineTo(CENTER_X, CENTER_Y + RADIUS);
      ctx.moveTo(CENTER_X - RADIUS, CENTER_Y);
      ctx.lineTo(CENTER_X + RADIUS, CENTER_Y);
      ctx.stroke();

      // Eigenes Zentrum (Heimatort) markieren
      ctx.fillStyle = '#00ff66';
      ctx.beginPath();
      ctx.arc(CENTER_X, CENTER_Y, 3, 0, Math.PI * 2);
      ctx.fill();

      // Rand
      ctx.strokeStyle = '#00ff66';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(CENTER_X, CENTER_Y, RADIUS, 0, Math.PI * 2);
      ctx.stroke();
    }

    // --- DREHENDER RADARSTRAHL ---
    function drawSweep() {
      sweepAngle += 0.025;
      if (sweepAngle >= Math.PI * 2) sweepAngle = 0;

      ctx.save();
      ctx.translate(CENTER_X, CENTER_Y);
      ctx.rotate(sweepAngle);

      let gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, RADIUS);
      gradient.addColorStop(0, 'rgba(0, 255, 102, 0.8)');
      gradient.addColorStop(1, 'rgba(0, 255, 102, 0.02)');

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, RADIUS, -0.3, 0); 
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.restore();
    }

    // --- MAIN LOOP ---
    function mainLoop() {
      drawRadarScope();
      drawMapOverlays(); // Kartenmaterial auf den Radar-Schirm zeichnen
      drawSweep();
      
      requestAnimationFrame(mainLoop);
    }

    mainLoop();
  </script>
</body>
</html>
