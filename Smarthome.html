<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Mein Dashboard</title>
    <style>
        body { background-color: #000; color: white; font-family: sans-serif; margin: 0; padding: 20px; overflow: hidden; }
        .container { display: flex; flex-direction: column; height: 100vh; }
        
        /* Der Kalender Bereich */
        iframe.calendar { border: 0; width: 100%; height: 800px; }

        /* Der Button Bereich */
        .button-area { text-align: center; padding-top: 20px; }
        
        .alexa-btn {
            background-color: #00a0d1; /* Alexa Blau */
            color: white;
            padding: 25px 50px;
            text-decoration: none;
            font-size: 30px;
            border-radius: 15px;
            display: inline-block;
            font-weight: bold;
            border: 3px solid #ffffff;
            cursor: pointer;
        }
        .alexa-btn:active { background-color: #007da4; transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dein Kalender (Höhe auf 800px angepasst) -->
        <iframe class="calendar" src="https://calendar.google.com/calendar/embed?src=nomabi3312%40gmail.com&ctz=Europe%2FBerlin&mode=WEEK&showTitle=0&showPrint=0&showTabs=1&showCalendars=0&showTz=0" frameborder="0" scrolling="no"></iframe>

        <!-- Dein neuer Licht-Button -->
        <div class="button-area">
            <a href="https://api-v3.voicemonkey.io/catch/b1c56071051c6f6c10e389e448068809/77c83699-b42d-4ec2-9539-c8c2b3e944a6" 
               target="hidden_frame" 
               class="alexa-btn">
               💡 LICHT AN
            </a>
        </div>
    </div>

    <!-- WICHTIG: Dieser versteckte Frame verhindert das Neuladen der Seite -->
    <iframe name="hidden_frame" style="display:none;"></iframe>

</body>
</html>
