<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro & Calorie Tracker</title>
    
    <!-- App Icons & Web-App Settings -->
    <link rel="apple-touch-icon" href="https://img.icons8.com/isometric/512/apple.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://img.icons8.com/isometric/512/apple.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Barcode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-amber: #f59e0b;
            --accent-pink: #ec4899;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-settings {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .date-picker {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .card-title {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .fill-calories { background-color: var(--accent-green); }
        .fill-protein { background-color: var(--accent-blue); }
        .fill-carbs { background-color: var(--accent-amber); }
        .fill-sugar { background-color: var(--accent-pink); }
        .fill-fat { background-color: var(--accent-red); }

        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        input[type="text"], input[type="number"] {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
        }

        button {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-add { background: var(--accent-green); }
        .btn-scan { background: var(--accent-purple); }

        .search-results {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .search-item {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        .btn-delete {
            background: transparent;
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 6px;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 15px auto;
            display: none;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }

        .modal-field {
            margin-bottom: 12px;
        }

        .modal-field label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>MacroTracker</h2>
            <p style="color: var(--text-muted); font-size: 13px;">Tracker mit Barcode-Scanner</p>
        </div>
        <div class="header-controls">
            <input type="date" id="track-date" class="date-picker">
            <button class="btn-settings" onclick="openSettings()" title="Tagesziele anpassen">⚙️</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="card">
            <div class="card-title">Kalorien</div>
            <div class="card-value"><span id="curr-kcal">0</span> / <span id="target-kcal">2000</span> <small>kcal</small></div>
            <div class="progress-bar"><div id="prog-kcal" class="progress-fill fill-calories" style="width: 0%;"></div></div>
        </div>
        <div class="card">
            <div class="card-title">Protein</div>
            <div class="card-value"><span id="curr-protein">0</span> / <span id="target-protein">150</span> <small>g</small></div>
            <div class="progress-bar"><div id="prog-protein" class="progress-fill fill-protein" style="width: 0%;"></div></div>
        </div>
        <div class="card">
            <div class="card-title">Carbs</div>
            <div class="card-value"><span id="curr-carbs">0</span> / <span id="target-carbs">200</span> <small>g</small></div>
            <div class="progress-bar"><div id="prog-carbs" class="progress-fill fill-carbs" style="width: 0%;"></div></div>
        </div>
        <div class="card">
            <div class="card-title">Zucker</div>
            <div class="card-value"><span id="curr-sugar">0</span> / <span id="target-sugar">50</span> <small>g</small></div>
            <div class="progress-bar"><div id="prog-sugar" class="progress-fill fill-sugar" style="width: 0%;"></div></div>
        </div>
        <div class="card">
            <div class="card-title">Fett</div>
            <div class="card-value"><span id="curr-fat">0</span> / <span id="target-fat">65</span> <small>g</small></div>
            <div class="progress-bar"><div id="prog-fat" class="progress-fill fill-fat" style="width: 0%;"></div></div>
        </div>
    </div>

    <div class="section-box">
        <h3 style="margin-bottom: 10px;">Lebensmittel hinzufügen</h3>
        
        <div class="search-container">
            <input type="text" id="api-search-input" placeholder="Online suchen..." style="flex: 1; min-width: 200px;">
            <button onclick="searchOpenFoodFacts()">Suchen</button>
            <button class="btn-scan" onclick="toggleScanner()">📷 Barcode scannen</button>
        </div>

        <div id="reader"></div>
        <div id="search-results" class="search-results"></div>

        <div class="grid-inputs">
            <input type="text" id="input-name" placeholder="Name">
            <input type="number" id="input-kcal" placeholder="Kcal">
            <input type="number" id="input-protein" placeholder="Protein (g)">
            <input type="number" id="input-carbs" placeholder="Carbs (g)">
            <input type="number" id="input-sugar" placeholder="Zucker (g)">
            <input type="number" id="input-fat" placeholder="Fett (g)">
        </div>
        <button class="btn-add" onclick="addCustomFood()" style="width: 100%;">Eintrag speichern</button>
    </div>

    <div class="section-box">
        <h3 style="margin-bottom: 10px;">Tagesprotokoll</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Lebensmittel</th>
                        <th>Kcal</th>
                        <th>Protein</th>
                        <th>Carbs</th>
                        <th>Zucker</th>
                        <th>Fett</th>
                        <th>Aktion</th>
                    </tr>
                </thead>
                <tbody id="log-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal für Einstellungen -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px;">Tagesziele anpassen</h3>
            <div class="modal-field">
                <label>Kalorien (kcal)</label>
                <input type="number" id="goal-kcal-input">
            </div>
            <div class="modal-field">
                <label>Protein (g)</label>
                <input type="number" id="goal-protein-input">
            </div>
            <div class="modal-field">
                <label>Kohlenhydrate (g)</label>
                <input type="number" id="goal-carbs-input">
            </div>
            <div class="modal-field">
                <label>Zucker (g)</label>
                <input type="number" id="goal-sugar-input">
            </div>
            <div class="modal-field">
                <label>Fett (g)</label>
                <input type="number" id="goal-fat-input">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="updateGoals()" style="flex: 1;" class="btn-add">Speichern</button>
                <button onclick="closeSettings()" style="background: var(--border-color);">Abbrechen</button>
            </div>
        </div>
    </div>

    <script>
        let targets = { kcal: 2000, protein: 150, carbs: 200, sugar: 50, fat: 65 };
        const currentDateInput = document.getElementById('track-date');
        currentDateInput.valueAsDate = new Date();
        let html5QrCode = null;

        window.onload = function() {
            loadGoals();
            loadLog();
            currentDateInput.addEventListener('change', loadLog);
        };

        function getStorageKey() { return `macro_log_${currentDateInput.value}`; }

        function loadGoals() {
            const saved = localStorage.getItem('macro_goals');
            if (saved) {
                targets = Object.assign(targets, JSON.parse(saved));
            }
            updateDashboardTargets();
        }

        function openSettings() {
            document.getElementById('goal-kcal-input').value = targets.kcal;
            document.getElementById('goal-protein-input').value = targets.protein;
            document.getElementById('goal-carbs-input').value = targets.carbs;
            document.getElementById('goal-sugar-input').value = targets.sugar || 50;
            document.getElementById('goal-fat-input').value = targets.fat;
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function updateGoals() {
            targets.kcal = parseFloat(document.getElementById('goal-kcal-input').value) || 2000;
            targets.protein = parseFloat(document.getElementById('goal-protein-input').value) || 150;
            targets.carbs = parseFloat(document.getElementById('goal-carbs-input').value) || 200;
            targets.sugar = parseFloat(document.getElementById('goal-sugar-input').value) || 50;
            targets.fat = parseFloat(document.getElementById('goal-fat-input').value) || 65;
            localStorage.setItem('macro_goals', JSON.stringify(targets));
            updateDashboardTargets();
            calculateTotals();
            closeSettings();
        }

        function updateDashboardTargets() {
            document.getElementById('target-kcal').innerText = targets.kcal;
            document.getElementById('target-protein').innerText = targets.protein;
            document.getElementById('target-carbs').innerText = targets.carbs;
            document.getElementById('target-sugar').innerText = targets.sugar || 50;
            document.getElementById('target-fat').innerText = targets.fat;
        }

        function loadLog() {
            const data = localStorage.getItem(getStorageKey());
            const items = data ? JSON.parse(data) : [];
            renderTable(items);
            calculateTotals(items);
        }

        function saveLog(items) {
            localStorage.setItem(getStorageKey(), JSON.stringify(items));
            renderTable(items);
            calculateTotals(items);
        }

        function addCustomFood() {
            const name = document.getElementById('input-name').value;
            const kcal = parseFloat(document.getElementById('input-kcal').value) || 0;
            const protein = parseFloat(document.getElementById('input-protein').value) || 0;
            const carbs = parseFloat(document.getElementById('input-carbs').value) || 0;
            const sugar = parseFloat(document.getElementById('input-sugar').value) || 0;
            const fat = parseFloat(document.getElementById('input-fat').value) || 0;

            if (!name) return alert('Bitte Name eingeben');

            const items = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
            items.push({ id: Date.now(), name, kcal, protein, carbs, sugar, fat });
            saveLog(items);

            document.getElementById('input-name').value = '';
            document.getElementById('input-kcal').value = '';
            document.getElementById('input-protein').value = '';
            document.getElementById('input-carbs').value = '';
            document.getElementById('input-sugar').value = '';
            document.getElementById('input-fat').value = '';
        }

        function deleteItem(id) {
            let items = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
            items = items.filter(item => item.id !== id);
            saveLog(items);
        }

        function renderTable(items) {
            const tbody = document.getElementById('log-table-body');
            tbody.innerHTML = '';
            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color: var(--text-muted);">Keine Einträge.</td></tr>';
                return;
            }
            items.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${item.name}</strong></td>
                    <td>${item.kcal}</td>
                    <td>${item.protein}g</td>
                    <td>${item.carbs}g</td>
                    <td>${item.sugar || 0}g</td>
                    <td>${item.fat}g</td>
                    <td><button class="btn-delete" onclick="deleteItem(${item.id})">x</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function calculateTotals(items) {
            if (!items) items = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
            let totals = { kcal: 0, protein: 0, carbs: 0, sugar: 0, fat: 0 };
            items.forEach(item => {
                totals.kcal += item.kcal;
                totals.protein += item.protein;
                totals.carbs += item.carbs;
                totals.sugar += (item.sugar || 0);
                totals.fat += item.fat;
            });

            document.getElementById('curr-kcal').innerText = Math.round(totals.kcal);
            document.getElementById('curr-protein').innerText = Math.round(totals.protein);
            document.getElementById('curr-carbs').innerText = Math.round(totals.carbs);
            document.getElementById('curr-sugar').innerText = Math.round(totals.sugar);
            document.getElementById('curr-fat').innerText = Math.round(totals.fat);

            document.getElementById('prog-kcal').style.width = Math.min((totals.kcal / targets.kcal) * 100, 100) + '%';
            document.getElementById('prog-protein').style.width = Math.min((totals.protein / targets.protein) * 100, 100) + '%';
            document.getElementById('prog-carbs').style.width = Math.min((totals.carbs / targets.carbs) * 100, 100) + '%';
            document.getElementById('prog-sugar').style.width = Math.min((totals.sugar / (targets.sugar || 50)) * 100, 100) + '%';
            document.getElementById('prog-fat').style.width = Math.min((totals.fat / targets.fat) * 100, 100) + '%';
        }

        async function searchOpenFoodFacts() {
            const query = document.getElementById('api-search-input').value;
            const resultsBox = document.getElementById('search-results');
            if (!query) return;
            resultsBox.style.display = 'block';
            resultsBox.innerHTML = '<div style="padding:10px;">Suche...</div>';

            try {
                const res = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=5`);
                const data = await res.json();
                resultsBox.innerHTML = '';
                if (data.products && data.products.length > 0) {
                    data.products.forEach(p => renderSearchResultItem(p));
                } else {
                    resultsBox.innerHTML = '<div style="padding:10px;">Nichts gefunden.</div>';
                }
            } catch (err) {
                resultsBox.innerHTML = '<div style="padding:10px;">Fehler bei der Suche.</div>';
            }
        }

        function fetchByBarcode(barcode) {
            const resultsBox = document.getElementById('search-results');
            resultsBox.style.display = 'block';
            resultsBox.innerHTML = '<div style="padding:10px;">Barcode wird abgerufen...</div>';

            const cleanBarcode = barcode.trim();
            
            fetch(`https://world.openfoodfacts.org/api/v2/product/${cleanBarcode}.json`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 1 && data.product && data.product.nutriments) {
                        resultsBox.innerHTML = '';
                        renderSearchResultItem(data.product);
                    } else {
                        const altBarcode = cleanBarcode.replace(/^0+/, '');
                        return fetch(`https://world.openfoodfacts.org/api/v2/product/${altBarcode}.json`)
                            .then(res => res.json())
                            .then(altData => {
                                resultsBox.innerHTML = '';
                                if (altData.status === 1 && altData.product && altData.product.nutriments) {
                                    renderSearchResultItem(altData.product);
                                } else {
                                    resultsBox.innerHTML = `<div style="padding:10px; color: var(--accent-red);">Produkt (${cleanBarcode}) nicht gefunden.</div>`;
                                }
                            });
                    }
                })
                .catch(() => {
                    resultsBox.innerHTML = '<div style="padding:10px;">Fehler beim Abruf des Barcodes.</div>';
                });
        }

        function renderSearchResultItem(p) {
            const resultsBox = document.getElementById('search-results');
            const n = p.nutriments || {};
            const name = p.product_name || 'Unbenannt';
            const kcal = Math.round(n['energy-kcal_100g'] || n['energy-kcal'] || 0);
            const protein = Math.round(n.proteins_100g || n.proteins || 0);
            const carbs = Math.round(n.carbohydrates_100g || n.carbohydrates || 0);
            const sugar = Math.round(n.sugars_100g || n.sugars || 0);
            const fat = Math.round(n.fat_100g || n.fat || 0);

            const div = document.createElement('div');
            div.className = 'search-item';
            div.innerHTML = `<div><strong>${name}</strong> (100g)<br><small>${kcal} kcal | P:${protein}g | C:${carbs}g | Z:${sugar}g | F:${fat}g</small></div><button class="btn-add">+</button>`;
            div.onclick = () => {
                document.getElementById('input-name').value = name + ' (100g)';
                document.getElementById('input-kcal').value = kcal;
                document.getElementById('input-protein').value = protein;
                document.getElementById('input-carbs').value = carbs;
                document.getElementById('input-sugar').value = sugar;
                document.getElementById('input-fat').value = fat;
                resultsBox.style.display = 'none';
            };
            resultsBox.appendChild(div);
        }

        function toggleScanner() {
            const readerDiv = document.getElementById('reader');
            if (readerDiv.style.display === 'block') {
                if (html5QrCode) {
                    html5QrCode.stop().then(() => {
                        readerDiv.style.display = 'none';
                    });
                }
            } else {
                readerDiv.style.display = 'block';
                html5QrCode = new Html5Qrcode("reader");
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 150 } },
                    (decodedText) => {
                        fetchByBarcode(decodedText);
                        html5QrCode.stop().then(() => {
                            readerDiv.style.display = 'none';
                        });
                    },
                    (errorMessage) => { }
                ).catch(err => {
                    alert('Kamera-Zugriff nicht möglich oder verweigert.');
                    readerDiv.style.display = 'none';
                });
            }
        }
    </script>
</body>
</html>
