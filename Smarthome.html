<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geräte Steuerung</title>
<style>
* { box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: #000000;
    color: white;
    margin: 0;
    padding: 20px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.back-btn {
    padding: 12px 25px;
    background-color: #1a1c2c;
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
    border: 1px solid #333;
}

h1 { margin: 0; font-size: 1.8rem; color: #ffffff; }

.dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1.3fr;
    gap: 20px;
    flex-grow: 1;
    height: calc(100% - 80px);
}

.column {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

h3 {
    font-size: 0.9rem;
    color: #7f8c8d;
    margin: 0 0 5px 0;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.widget {
    background: #1a1c2c;
    border-radius: 15px;
    padding: 15px 20px;
    border: 1px solid #2d2f3b;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-decoration: none;
    color: white;
    cursor: pointer;
    min-height: 90px; 
    transition: all 0.2s ease;
}

.widget:active { transform: scale(0.96); }

/* Standard-Zustand für Status-Farben */
.border-red-init { border-left: 6px solid #e74c3c; } /* Roter Rahmen am Anfang */
.heat-active { background: #cc6600; border: none; }

.widget-title { font-size: 0.85rem; opacity: 0.7; margin-bottom: 3px; }
.widget-value { font-size: 1.3rem; font-weight: bold; }
</style>
</head>
<body>

<div class="header">
    <a href="dashboard.html" class="back-btn">← DASHBOARD</a>
    <h1>Geräte Steuerung</h1>
    <div style="width: 120px;"></div>
</div>

<div class="dashboard-grid">

    <div class="column">
        <h3>🌡️ Heizung</h3>
        <a href="intent://open#Intent;scheme=calorbt;package=com.eurotronic.calorbt;end" class="widget heat-active">
            <div class="widget-title">Wohnzimmer</div>
            <div class="widget-value">21.0°C</div>
        </a>
        <div class="widget">
            <div class="widget-title">Küche</div>
            <div class="widget-value">20.5°C</div>
        </div>
    </div>

    <div class="column">
        <h3>🛡️ Türschloss</h3>
        
        <div id="btnWohnung" class="widget border-red-init" 
             style="background-color: rgb(26, 28, 44);"
             onclick="toggleSchloss('btnWohnung', 'valWohnung', 'linkZusperrenWohnung', 'linkAufsperrenWohnung')">
            <div class="widget-title">Wohnung</div>
            <div id="valWohnung" class="widget-value">Neutral 🔐</div>
        </div>

        <div id="btnStudio" class="widget border-red-init" 
             style="background-color: rgb(26, 28, 44);"
             onclick="toggleSchloss('btnStudio', 'valStudio', 'linkZusperrenStudio', 'linkAufsperrenStudio')">
            <div class="widget-title">Studio</div>
            <div id="valStudio" class="widget-value">Neutral 🔐</div>
        </div>
    </div>

    <div class="column">
        <h3>🎙️ Alexa Befehle</h3>
        
        <div id="alexaBtn" class="widget" style="background-color: rgb(26, 28, 44); border-left: 6px solid #333;" onclick="toggleAlexa()">
            <div class="widget-title">Couch Licht</div>
            <div id="alexaValue" class="widget-value">AUS 🌑</div>
        </div>

        <div class="widget" style="border-left: 6px solid #e74c3c; background-color: rgb(26, 28, 44);" 
             onclick="sendeBefehl('https://api-v3.voicemonkey.io/catch/b1c56071051c6f6c10e389e448068809/3fcc3293-9c2f-4fa5-8d23-56aaeda7e21d')">
            <div class="widget-title">Szenen</div>
            <div class="widget-value">ALLES AUS 💤</div>
        </div>
    </div>

</div>

<script>
// Deine Voice Monkey Links (Bitte die korrekten Links eintragen!)
const links = {
    linkAn: "https://api-v3.voicemonkey.io/catch/b1c56071051c6f6c10e389e448068809/77c83699-b42d-4ec2-9539-c8c2b3e944a6",
    linkAus: "https://api-v3.voicemonkey.io/catch/b1c56071051c6f6c10e389e448068809/3fcc3293-9c2f-4fa5-8d23-56aaeda7e21d",
    
    // Links für die Schlösser (Hier deine echten v3-Links eintragen!)
    linkZusperrenWohnung: "https://api-v3.voicemonkey.io/catch/b1c56071051c6f6c10e389e448068809/6e2c2296-db26-43b2-9749-7ad2fa0f5be9",
    linkAufsperrenWohnung: "HIER_LINK_AUFSPERREN_WOHNUNG_EINFÜGEN", // Nocht nicht befüllt!
    
    linkZusperrenStudio: "https://api-v3.voicemonkey.io/catch/b1c56071051c6f6c10e389e448068809/0166c453-8fa8-4ed8-8b75-437825f4eb25",
    linkAufsperrenStudio: "HIER_LINK_AUFSPERREN_STUDIO_EINFÜGEN" // Noch nicht befüllt!
};

// Hauptfunktion für den Couch-Licht-Umschalter
function toggleAlexa() {
    const btn = document.getElementById("alexaBtn");
    const val = document.getElementById("alexaValue");
    
    if (btn.style.backgroundColor === "rgb(26, 28, 44)") {
        btn.style.backgroundColor = "#00a0d1"; // Alexa Blau
        btn.style.borderLeftColor = "#ffffff";
        val.innerHTML = "AN 💡";
        sendeBefehl(links.linkAn);
    } else {
        btn.style.backgroundColor = "rgb(26, 28, 44)"; // Wieder dunkel
        btn.style.borderLeftColor = "#333";
        val.innerHTML = "AUS 🌑";
        sendeBefehl(links.linkAus);
    }
}

// NEU: Hauptfunktion für die Schlösser-Umschalter (Status-Farbe)
function toggleSchloss(btnId, valId, linkZusperrenKey, linkAufsperrenKey) {
    const btn = document.getElementById(btnId);
    const val = document.getElementById(valId);
    const linkZusperren = links[linkZusperrenKey];
    const linkAufsperren = links[linkAufsperrenKey];

    // Wenn er im Neutral-Zustand (dunkel) ist -> ROT (Zusperren)
    if (btn.style.backgroundColor === "rgb(26, 28, 44)") {
        btn.style.backgroundColor = "#e74c3c"; // Roter Hintergrund
        btn.style.border = "none"; // Rahmen entfernen, um die Farbe wirken zu lassen
        btn.style.borderLeft = "6px solid #c0392b"; // Dunkelroter Rand links
        val.innerHTML = "ZUGESPERRT 🔐";
        sendeBefehl(linkZusperren);
    } 
    // Wenn er rot ist -> NEUTRAL (Aufsperren)
    else {
        btn.style.backgroundColor = "rgb(26, 28, 44)"; // Ursprungsfarbe
        btn.style.border = "1px solid #2d2f3b"; // Standard-Rahmen
        btn.style.borderLeft = "6px solid #e74c3c"; // Roter Standard-Rand
        val.innerHTML = "NEUTRAL 🔐";
        sendeBefehl(linkAufsperren);
    }
}

// Der "Hintergrund-Sender", der die v3-Sperre umgeht
function sendeBefehl(zielUrl) {
    if(!zielUrl || zielUrl.startsWith('HIER')) return;
    
    fetch(zielUrl, {
        method: 'POST',
        mode: 'no-cors' // Zwingt den Browser das Signal ohne Meckern zu senden
    }).catch(err => console.log("Fehler abgefangen"));
}

if (typeof fully !== 'undefined') {
    fully.clearCache();
}
</script>
</body>
</html>
