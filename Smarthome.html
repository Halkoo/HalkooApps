<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geräte Steuerung</title>
<style>
* { box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: #000000;
    color: white;
    margin: 0;
    padding: 20px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.back-btn {
    padding: 12px 25px;
    background-color: #1a1c2c;
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
    border: 1px solid #333;
}

h1 { margin: 0; font-size: 1.8rem; color: #ffffff; }

.dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1.3fr;
    gap: 20px;
    flex-grow: 1;
    height: calc(100% - 80px);
}

.column {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

h3 {
    font-size: 0.9rem;
    color: #7f8c8d;
    margin: 0 0 5px 0;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.widget {
    background: #1a1c2c;
    border-radius: 15px;
    padding: 15px 20px;
    border: 1px solid #2d2f3b;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-decoration: none;
    color: white;
    cursor: pointer;
    min-height: 90px; 
    transition: all 0.2s ease;
}

.widget:active { transform: scale(0.96); }

.border-red { border-left: 6px solid #e74c3c; }
.border-blue { border-left: 6px solid #00a1ff; }
.heat-active { background: #cc6600; border: none; }

.widget-title { font-size: 0.85rem; opacity: 0.7; margin-bottom: 3px; }
.widget-value { font-size: 1.3rem; font-weight: bold; }

#hidden_frame { display: none; }
</style>
</head>
<body>

<div class="header">
    <a href="dashboard.html" class="back-btn">← DASHBOARD</a>
    <h1>Geräte Steuerung</h1>
    <div style="width: 120px;"></div>
</div>

<div class="dashboard-grid">

    <!-- SPALTE 1: HEIZUNG -->
    <div class="column">
        <h3>🌡️ Heizung</h3>
        <a href="intent://open#Intent;scheme=calorbt;package=com.eurotronic.calorbt;end" class="widget heat-active">
            <div class="widget-title">Wohnzimmer</div>
            <div class="widget-value">21.0°C</div>
        </a>
        <div class="widget">
            <div class="widget-title">Küche</div>
            <div class="widget-value">20.5°C</div>
        </div>
    </div>

    <!-- SPALTE 2: APPS -->
    <div class="column">
        <h3>🛡️ Apps</h3>
        <a href="intent://open#Intent;scheme=switchbot;package=com.theswitchbot.switchbot;end" class="widget border-red">
            <div class="widget-title">SwitchBot</div>
            <div class="widget-value">Türschloss 🔐</div>
        </a>
        <div class="widget border-blue">
            <div class="widget-title">Status</div>
            <div class="widget-value">System Aktiv</div>
        </div>
    </div>

    <!-- SPALTE 3: ALEXA BUTTONS -->
    <div class="column">
        <h3>🎙️ Alexa Befehle</h3>
        
        <!-- DEIN COUCH LICHT (MIT FUNKTION) -->
        <a href="https://api-v3.voicemonkey.io/catch/b1c56071051c6f6c10e389e448068809/77c83699-b42d-4ec2-9539-c8c2b3e944a6" 
           target="hidden_frame" 
           id="btn1" 
           class="widget" 
           style="background-color: #1a1c2c; border-left: 6px solid #333;" 
           onclick="toggle('btn1', 'val1', 'https://api-v3.voicemonkey.io/catch/b1c56071051c6f6c10e389e448068809/77c83699-b42d-4ec2-9539-c8c2b3e944a6', 'HIER_AUS_LINK_EINFÜGEN')">
            <div class="widget-title">Licht</div>
            <div id="val1" class="widget-value">AUS 🌑</div>
        </a>

        <!-- DEIN ALLES AUS BUTTON -->
        <a href="https://api-v3.voicemonkey.io/catch/b1c56071051c6f6c10e389e448068809/3fcc3293-9c2f-4fa5-8d23-56aaeda7e21d" 
           target="hidden_frame" 
           class="widget border-red">
            <div class="widget-title">Szenen</div>
            <div class="widget-value">ALLES AUS 💤</div>
        </a>

        <!-- LEERER PLATZHALTER BUTTON -->
        <div class="widget border-blue">
            <div class="widget-title">Frei</div>
            <div class="widget-value">Befehl 3</div>
        </div>
    </div>

</div>

<iframe name="hidden_frame" id="hidden_frame"></iframe>

<script>
function toggle(btnId, valId, linkAn, linkAus) {
    const btn = document.getElementById(btnId);
    const val = document.getElementById(valId);
    
    // Farbaustausch Logik
    if (btn.style.backgroundColor === "rgb(26, 28, 44)" || btn.style.backgroundColor === "#1a1c2c") {
        btn.style.backgroundColor = "#00a0d1"; 
        btn.style.borderLeftColor = "#ffffff";
        val.innerHTML = "AN 💡";
        btn.href = linkAn;
    } else {
        btn.style.backgroundColor = "#1a1c2c"; 
        btn.style.borderLeftColor = "#333";
        val.innerHTML = "AUS 🌑";
        btn.href = linkAus;
    }
}
</script>
</body>
</html>
