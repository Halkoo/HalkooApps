<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klassisches ADS-B Radar (SIMULATION)</title>
  <style>
    body {
      background-color: #050b05; /* Sehr dunkles Grün */
      color: #00ff66; /* Leuchtend grüner Text */
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden; /* Verhindert Scrollbalken */
    }
    h2 {
      margin-bottom: 10px;
      text-shadow: 0 0 10px #00ff66;
      letter-spacing: 2px;
    }
    #radarCanvas {
      background-color: #001100; /* Dunkelgrüner Schirm */
      border: 4px solid #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.5);
    }
    .info {
      margin-top: 15px;
      font-size: 14px;
      text-shadow: 0 0 5px #00ff66;
      background: rgba(0, 20, 0, 0.8);
      padding: 5px 15px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h2>ATC RADAR SCOPE</h2>
  <canvas id="radarCanvas" width="650" height="650"></canvas>
  <div class="info" id="status">Simulation läuft (Demo-Modus)...</div>

  <script>
    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');

    const CENTER_X = canvas.width / 2;
    const CENTER_Y = canvas.height / 2;
    const RADIUS = (canvas.width / 2) - 15;

    let sweepAngle = 0;
    let aircraftList = [];
    const NUM_SIM_AIRCRAFT = 6; // Anzahl der gefakten Flugzeuge

    // --- INITIALISIERUNG DER SIMULATIONS-DATEN ---

    // Wir erstellen künstliche Flugzeuge mit Startpositionen und Geschwindigkeiten
    function initSimulation() {
      const callsigns = ["DLH123", "AFR456", "BAW789", "RYR101", "KLM202", "UAE303"];
      aircraftList = [];
      for (let i = 0; i < NUM_SIM_AIRCRAFT; i++) {
        // Position relativ zum Zentrum (in Pixeln, nicht GPS-Grad)
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * RADIUS * 0.8; 
        
        aircraftList.push({
          id: callsigns[i] || `SIM${i+1}`,
          xRel: Math.cos(angle) * dist,
          yRel: Math.sin(angle) * dist,
          alt: Math.floor(Math.random() * 300) * 100 + 5000, // Höhe zw. 5000 und 35000 ft
          vx: (Math.random() - 0.5) * 0.4, // Geschwindigkeit in X
          vy: (Math.random() - 0.5) * 0.4  // Geschwindigkeit in Y
        });
      }
    }

    // --- ZEICHNEN DES RADARS ---

    // 1. Hintergrund & Radar-Ringe (wird jede Frame neu gezeichnet)
    function drawRadarScope() {
      // WICHTIG: Das leichte 'rgba(..., 0.15)' sorgt für das Nachleuchten der Flieger (Fade-out)!
      ctx.fillStyle = 'rgba(0, 17, 0, 0.15)'; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Statische Gitterringe (stärker)
      ctx.strokeStyle = '#004411';
      ctx.lineWidth = 1;

      // Die 4 Entfernungsringe
      for (let r = 1; r <= 4; r++) {
        ctx.beginPath();
        ctx.arc(CENTER_X, CENTER_Y, (RADIUS / 4) * r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Zentrales Fadenkreuz
      ctx.beginPath();
      ctx.moveTo(CENTER_X, CENTER_Y - RADIUS);
      ctx.lineTo(CENTER_X, CENTER_Y + RADIUS);
      ctx.moveTo(CENTER_X - RADIUS, CENTER_Y);
      ctx.lineTo(CENTER_X + RADIUS, CENTER_Y);
      ctx.stroke();
      
      // Äußerer, dickerer Rand
      ctx.strokeStyle = '#00ff66';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(CENTER_X, CENTER_Y, RADIUS, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 2. Rotierenden Strahl zeichnen
    function drawSweep() {
      // Rotationsgeschwindigkeit
      sweepAngle += 0.025;
      if (sweepAngle >= Math.PI * 2) sweepAngle = 0;

      ctx.save();
      ctx.translate(CENTER_X, CENTER_Y);
      ctx.rotate(sweepAngle);

      // Radarstrahl mit starkem Farbverlauf (leuchtender Fächer)
      let gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, RADIUS);
      gradient.addColorStop(0, 'rgba(0, 255, 102, 0.9)');
      gradient.addColorStop(0.1, 'rgba(0, 255, 102, 0.6)');
      gradient.addColorStop(1, 'rgba(0, 255, 102, 0.05)');

      ctx.beginPath();
      ctx.moveTo(0, 0);
      // Der Winkel des Fächers (0.3 Radians)
      ctx.arc(0, 0, RADIUS, -0.3, 0); 
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.restore();
    }

    // 3. Simulations-Flugzeuge aktualisieren & zeichnen
    function drawSimulationAircraft() {
      aircraftList.forEach(ac => {
        // A) Bewegung aktualisieren
        ac.xRel += ac.vx;
        ac.yRel += ac.vy;

        // B) Kollision mit dem Rand (Abprallen)
        const dist = Math.hypot(ac.xRel, ac.yRel);
        if (dist > RADIUS * 0.95) {
          // Normalenvektor zur Kollision berechnen und Geschwindigkeit umkehren
          const nx = ac.xRel / dist;
          const ny = ac.yRel / dist;
          const dot = ac.vx * nx + ac.vy * ny;
          ac.vx -= 2 * dot * nx;
          ac.vy -= 2 * dot * ny;
          // Position leicht korrigieren, um Feststecken zu verhindern
          ac.xRel = nx * (RADIUS * 0.94);
          ac.yRel = ny * (RADIUS * 0.94);
        }

        // C) Zeichnen auf dem Canvas
        const posX = CENTER_X + ac.xRel;
        const posY = CENTER_Y + ac.yRel;

        // Blip (Hellgrüner Punkt)
        ctx.fillStyle = '#ccffdd'; // Etwas heller als der Strahl
        ctx.beginPath();
        ctx.arc(posX, posY, 4, 0, Math.PI * 2);
        ctx.fill();

        // Leuchteffekt um den Punkt
        ctx.shadowColor = '#00ff66';
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.shadowBlur = 0; // Zurücksetzen

        // D) Text-Datenblock (Callsign & Höhe in ft)
        ctx.fillStyle = '#00ff66';
        ctx.font = 'bold 11px "Courier New", monospace';
        
        const altStr = `${Math.floor(ac.alt)}ft`;
        const speed = Math.round(Math.hypot(ac.vx, ac.vy) * 1000); // Fiktive Speed
        const speedStr = `${speed}kts`;

        // Textposition (versetzt zum Punkt)
        ctx.fillText(ac.id, posX + 10, posY - 2);
        ctx.font = '10px "Courier New", monospace';
        ctx.fillText(altStr, posX + 10, posY + 10);
        // ctx.fillText(speedStr, posX + 10, posY + 20); // Optional: Speed
      });
    }

    // --- MAIN ANIMATION LOOP ---

    function mainLoop() {
      // 1. Gitter und Nachleucht-Effekt zeichnen
      drawRadarScope();
      
      // 2. Flugzeuge simulieren, bewegen und zeichnen
      drawSimulationAircraft();
      
      // 3. Den rotierenden Strahl ganz oben drüber legen
      drawSweep();
      
      // Fordert den Browser auf, das nächste Frame zu zeichnen
      requestAnimationFrame(mainLoop);
    }

    // --- START ---

    // 1. Flugzeuge erzeugen
    initSimulation();
    
    // 2. Animations-Loop starten
    mainLoop();
    
    // Status-Update (für die Optik)
    statusDiv.innerText = `SIMULATION AKTIV | ${NUM_SIM_AIRCRAFT} Test-Ziele`;

  </script>
</body>
</html>
