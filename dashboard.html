<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHome Central</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #6c5ce7;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            grid-template-rows: auto 1fr auto;
            gap: 20px;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Wetter / Ventusky Bereich */
        .weather-main {
            grid-row: 1 / 3;
            background: var(--card-bg);
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            border: 1px solid #334155;
        }

        iframe.ventusky {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Widgets Rechts */
        .widget {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 20px;
            border: 1px solid #334155;
            overflow-y: auto;
        }

        .clock {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            color: var(--accent);
        }

        /* Einbindung deines Wochenplans */
        .meal-frame {
            width: 100%;
            height: 350px;
            border: none;
            border-radius: 15px;
        }

        /* Smarthome Button Leiste unten */
        .controls {
            grid-column: 1 / 3;
            display: flex;
            gap: 15px;
            justify-content: center;
            padding: 10px;
        }

        .smart-btn {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            color: white;
            padding: 20px 40px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
        }

        .smart-btn:active {
            background: var(--accent);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- LINKS: Wetter -->
    <div class="weather-main">
        <!-- Ersetze den Link durch deinen spezifischen Ventusky-Embed-Link falls vorhanden -->
        <iframe class="ventusky" src="https://www.ventusky.com/?p=48.21;16.37;5&l=temperature-2m"></iframe>
    </div>

    <!-- OBEN RECHTS: Uhr & Kalender -->
    <div class="widget">
        <div id="clock" class="clock">00:00</div>
        <div style="height: 200px; text-align:center; color: #94a3b8;">
            [Hier Kalender-Widget einfügen]
        </div>
    </div>

    <!-- MITTE RECHTS: Dein Wochenplan -->
    <div class="widget">
        <h3 style="margin-top:0">🍴 Küchen-Plan</h3>
        <iframe class="meal-frame" src="https://halkoo.github.io/Einkaufsliste/"></iframe>
    </div>

    <!-- UNTEN: Smarthome Steuerung -->
    <div class="controls">
        <button class="smart-btn" onclick="control('Licht Wohnzimmer')">💡 Licht</button>
        <button class="smart-btn" onclick="control('Heizung')">🌡️ Heizung</button>
        <button class="smart-btn" onclick="control('TV')">📺 TV</button>
        <button class="smart-btn" onclick="location.reload()">🔄 Refresh</button>
    </div>

    <script>
        // Uhrzeit-Funktion
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('clock').innerText = time;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Platzhalter für Smarthome Logik
        function control(device) {
            alert(device + ' wird geschaltet...');
            // Hier kommt später die URL deiner Smarthome-API rein (z.B. Shelly, IFTTT)
        }
    </script>
</body>
</html>
