<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S8 Smart Dashboard</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        body {
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            background: var(--bg-gradient);
            font-family: 'Segoe UI', sans-serif;
            color: white;
            display: grid;
            /* Links die Buttons (ca. 220px), rechts der Rest */
            grid-template-columns: 220px 1fr;
            gap: 20px;
            overflow: hidden;
        }

        /* LINKE SPALTE: BUTTONS */
        .button-sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 15px;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.2s;
            text-align: center;
        }

        .action-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }
        
        .btn-large { padding: 30px 15px; } /* Für den Wochenplan Button */
        .btn-accent { background: #6c5ce7; border: none; }

        /* RECHTE SPALTE: CONTENT */
        .main-content {
            display: grid;
            grid-template-rows: auto 1fr; /* Oben Uhr/Wetter, unten Kalender */
            gap: 20px;
        }

        .top-row {
            display: grid;
            grid-template-columns: 1fr 1.5fr; /* Uhr links, Wetter rechts */
            gap: 20px;
            align-items: stretch;
        }

        /* UHR */
        .time-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
        }

        .clock { font-size: 4.5rem; font-weight: bold; line-height: 1; }
        .date { font-size: 1.2rem; opacity: 0.8; margin-top: 10px; }

        /* WETTER */
        .weather-card {
            background: var(--glass);
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            min-height: 250px;
            border: 1px solid var(--glass-border);
        }

        .weather-card iframe {
            position: absolute;
            width: 150% !important; /* Zoom gegen die Ventusky-Buttons */
            height: 150% !important;
            top: -25%;
            left: -25%;
            border: none;
        }

        /* KALENDER */
        .calendar-card {
            background: var(--glass);
            border-radius: 25px;
            padding: 10px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
        }

        .calendar-card iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 15px;
            filter: invert(0.9) hue-rotate(180deg) opacity(0.7);
        }

        /* WOCHENPLAN OVERLAY */
        #plan-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center;
        }
        .overlay-content { width: 90%; height: 90%; background: white; border-radius: 30px; overflow: hidden; }
    </style>
</head>
<body>

    <div class="button-sidebar">
        <button class="action-btn" onclick="control('heizung')">🌡️ Heizung</button>
        <button class="action-btn" onclick="control('licht')">💡 Licht</button>
        <button class="action-btn" onclick="control('tuer')">🔓 Tür</button>
        
        <div style="flex-grow: 1;"></div> <button class="action-btn btn-large btn-accent" onclick="togglePlan(true)">🍴 WOCHENPLAN</button>
        
        <button class="action-btn" onclick="control('spotify')">🎵 Spotify</button>
        <button class="action-btn">+</button>
        <button class="action-btn">+</button>
    </div>

    <div class="main-content">
        <div class="top-row">
            <div class="time-card">
                <div id="clock" class="clock">00:00</div>
                <div id="date" class="date">Sonntag, 10. Mai</div>
            </div>
            <div class="weather-card">
                <iframe src="https://www.ventusky.com/?p=48.21;16.37;8&l=temperature-2m"></iframe>
            </div>
        </div>

        <div class="calendar-card">
            <iframe src="https://calendar.google.com/calendar/embed?src=halkoo%40gmail.com&ctz=Europe%2FBerlin&mode=AGENDA&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0"></iframe>
        </div>
    </div>

    <div id="plan-overlay">
        <button style="position:absolute; top:20px; right:20px; padding:15px; border-radius:10px; background:#ff7675; color:white; border:none; font-weight:bold;" onclick="togglePlan(false)">X Schließen</button>
        <div class="overlay-content">
            <iframe id="plan-iframe" src="" style="width:100%; height:100%; border:none;"></iframe>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('date').innerText = now.toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
        }
        setInterval(updateTime, 1000);
        updateTime();

        function togglePlan(show) {
            const overlay = document.getElementById('plan-overlay');
            const iframe = document.getElementById('plan-iframe');
            if(show) {
                iframe.src = "https://halkoo.github.io/Wochenplan/"; 
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
                iframe.src = "";
            }
        }

        function control(device) {
            console.log("Befehl: " + device);
            // Hier kommen deine IFTTT / Alexa Links rein
        }
    </script>
</body>
</html>
