<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S8 SmartHome Dashboard</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #6c5ce7;
        }

        body {
            margin: 0;
            padding: 15px;
            height: 100vh;
            box-sizing: border-box;
            background: linear-gradient(145deg, #1e3a8a 0%, #7e22ce 50%, #be185d 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            display: grid;
            /* 40% für links (Uhr/Wetter), der Rest für Kalender */
            grid-template-columns: 40% 1fr; 
            grid-template-rows: 1fr auto;
            gap: 15px;
            overflow: hidden;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        .time-container { margin-bottom: 10px; }
        .clock { font-size: 4.5rem; font-weight: bold; line-height: 1; }
        .date { font-size: 1.4rem; opacity: 0.9; margin-top: 5px; color: #e0e0e0; }

        /* WETTER KACHEL OPTIMIERUNG */
        .weather-widget {
            flex-grow: 1;
            padding: 0 !important;
            overflow: hidden; /* Schneidet die Ventusky-Ränder ab */
            position: relative;
            border-radius: 30px;
        }

        .weather-widget iframe {
            position: absolute;
            /* Vergrößert das Iframe, um die UI-Elemente am Rand zu verstecken */
            width: 150% !important; 
            height: 150% !important;
            top: -25%; 
            left: -25%;
            border: none;
        }

        .calendar-container {
            height: 92%; /* Kalender nutzt fast die ganze Höhe rechts */
            align-self: flex-start;
        }

        .calendar-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 20px;
            filter: invert(0.9) hue-rotate(180deg) opacity(0.8);
        }

        .bottom-bar {
            grid-column: 1 / 3;
            display: flex;
            gap: 12px;
            margin-top: 5px;
        }

        .action-btn {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 15px 25px;
            border-radius: 18px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-plan { background: var(--accent); border: none; }
