<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S8 SmartHome Dashboard</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #6c5ce7;
        }

        body {
            margin: 0;
            padding: 15px;
            height: 100vh;
            box-sizing: border-box;
            background: linear-gradient(145deg, #1e3a8a 0%, #7e22ce 50%, #be185d 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            display: grid;
            /* Aufteilung links zu rechts: 40% zu 60% */
            grid-template-columns: 40% 1fr; 
            grid-template-rows: 1fr auto;
            gap: 15px;
            overflow: hidden;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        /* Uhr & Datum */
        .time-container { margin-bottom: 10px; padding-left: 10px; }
        .clock { font-size: 5rem; font-weight: bold; line-height: 1; text-shadow: 2px 2px 10px rgba(0,0,0,0.3); }
        .date { font-size: 1.5rem; opacity: 0.9; margin-top: 5px; color: #e0e0e0; }

        /* WETTER KACHEL - FIX GEGEN STÖRENDE TEXTE */
        .weather-widget {
            flex-grow: 1;
            padding: 0 !important;
            overflow: hidden; /* Schneidet alles außerhalb der Kachel ab */
            position: relative;
            border-radius: 30px;
        }

        .weather-widget iframe {
            position: absolute;
            /* Wir machen das Wetter-Fenster 50% größer als die Kachel */
            width: 150% !important; 
            height: 150% !important;
            /* Wir schieben es um 25% nach außen, um die Ränder (Texte) zu verstecken */
            top: -25%; 
            left: -25%;
            border: none;
        }

        /* KALENDER KACHEL */
        .calendar-container {
            height: 94%; 
            align-self: flex-start;
            margin-right: 10px;
        }

        .calendar-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 20px;
            /* Macht den weißen Google Kalender dunkel */
            filter: invert(0.9) hue-rotate(180deg) opacity(0.8);
        }

        /* BUTTONS UNTEN */
        .bottom-bar {
            grid-column: 1 / 3;
            display: flex;
            gap: 12px;
            margin-top: 5px;
            padding-bottom: 5px;
        }

        .action-btn {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 18px 28px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-plan { background: var(--accent); border: none; box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4); }
        .action-btn:active { transform: scale(0.95); }
