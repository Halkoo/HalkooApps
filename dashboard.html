<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Home S8</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #6c5ce7;
        }

        body {
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Segoe UI', sans-serif;
            color: white;
            display: grid;
            /* Layout: Linke Spalte (Uhr/Wetter) ca. 40%, Rechte Spalte (Kalender) 60% */
            grid-template-columns: 1fr 1.5fr;
            grid-template-rows: auto 1fr auto; 
            gap: 20px;
            overflow: hidden;
        }

        /* 1. OBEN LINKS: UHR */
        .time-box {
            grid-column: 1;
            grid-row: 1;
            padding: 10px;
        }
        .clock { font-size: 5.5rem; font-weight: bold; line-height: 1; }
        .date { font-size: 1.5rem; opacity: 0.8; margin-top: 5px; }

        /* 2. RECHTS: GROSSER KALENDER */
        .calendar-box {
            grid-column: 2;
            grid-row: 1 / span 2; /* Geht über zwei Reihen nach unten */
            background: var(--glass);
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            padding: 15px;
            overflow: hidden;
        }
        .calendar-box iframe {
            width: 100%; height: 100%; border: none; border-radius: 20px;
            filter: invert(0.9) hue-rotate(180deg) opacity(0.7);
        }

        /* 3. LINKS UNTER UHR: WETTER */
        .weather-box {
            grid-column: 1;
            grid-row: 2;
            background: var(--glass);
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
            position: relative;
        }
        /* Trick: Wetter vergrößern und Ränder abschneiden */
        .weather-box iframe {
            position: absolute;
            width: 160% !important;
            height: 160% !important;
            top: -30%;
            left: -30%;
            border: none;
        }

        /* 4. UNTEN: BUTTONS */
        .button-area {
            grid-column: 1 / span 2;
            display: grid;
            /* Deine zwei Reihen aus der Skizze */
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            padding-top: 10px;
        }

        .action-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 20px 10px;
            border-radius: 20px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
        }

        /* Breiter Wochenplan-Button aus deiner Skizze */
        .btn-wide { grid-column: span 2; background: var(--accent); border: none; font-size: 1.1rem; }
        .action-btn:active { transform: scale(0.95); }

        /* Overlay für Wochenplan */
        #plan-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center;
        }
        .overlay-content { width: 92%; height: 92%; background: white; border-radius: 35px; overflow: hidden; }
    </style>
</head>
<body>

    <div class="time-box">
        <div id="clock" class="clock">00:00</div>
        <div id="date" class="date">Sonntag, 10.05.26</div>
    </div>

    <div class="weather-box">
        <iframe src="https://www.ventusky.com/?p=48.21;16.37;8&l=temperature-2m"></iframe>
    </div>

    <div class="calendar-box">
        <iframe src="https://calendar.google.com/calendar/embed?src=halkoo%40gmail.com&ctz=Europe%2FBerlin&mode=AGENDA&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0"></iframe>
    </div>

    <div class="button-area">
        <button class="action-btn" onclick="control('licht')">💡 Licht</button>
        <button class="action-btn" onclick="control('tuer')">🔓 Tür</button>
        <button class="action-btn btn-wide" onclick="togglePlan(true)">🍴 Wochenplan</button>
        <button class="action-btn"></button> <button class="action-btn"></button>

        <button class="action-btn" onclick="control('heizung')">🌡️ Heizung</button>
        <button class="action-btn">+</button>
        <button class="action-btn">+</button>
        <button class="action-btn">+</button>
        <button class="action-btn" onclick="control('spotify')">🎵 Spotify</button>
        <button class="action-btn"></button>
    </div>

    <div id="plan-overlay">
        <button style="position:absolute; top:20px; right:20px; padding:15px; background:#ff7675; color:white; border:none; border-radius:10px; font-weight:bold;" onclick="togglePlan(false)">X Schließen</button>
        <div class="overlay-content">
            <iframe id="plan-iframe" src="" style="width:100%; height:100%; border:none;"></iframe>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('date').innerText = now.toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit', year: '2-digit' });
        }
        setInterval(updateTime, 1000);
        updateTime();

        function togglePlan(show) {
            const overlay = document.getElementById('plan-overlay');
            const iframe = document.getElementById('plan-iframe');
            if(show) {
                iframe.src = "https://halkoo.github.io/Wochenplan/"; 
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
                iframe.src = "";
            }
        }

        function control(dev) { console.log("Befehl an: " + dev); }
    </script>
</body>
</html>
