<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halkoo Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1c2c; /* Dunkles Blau-Grau */
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* LINKS: 35% Breite */
        .side-panel {
            width: 35%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #clock { font-size: 5.5rem; font-weight: bold; margin: 0; letter-spacing: -2px; }
        #date { font-size: 1.8rem; opacity: 0.8; margin-bottom: 5px; }

        /* VENTUSKY WETTER */
        .weather-container {
            flex-grow: 1;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 22px;
            border-radius: 20px;
            text-align: center;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }

        .btn-plan { background-color: #6366f1; } /* Lila */
        .btn-spotify { background-color: #1DB954; } /* Spotify Grün */
