<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartHome Central S8</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #6c5ce7;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden; /* Verhindert Scrollen der ganzen Seite */
        }

        /* Obere Sektion: Wetter & Info nebeneinander */
        .top-row {
            display: flex;
            flex: 1; /* Nutzt den verfügbaren Platz */
            gap: 15px;
            min-height: 0; /* Wichtig für Flex-Scroll-Verhalten */
            margin-bottom: 15px;
        }

        /* Wetter kleiner: jetzt auf 40% Breite */
        .weather-container {
            flex: 4; 
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #334155;
        }

        iframe.ventusky {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Rechte Spalte: Uhr & Plan (60% Breite) */
        .info-col {
            flex: 6;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .widget {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid #334155;
            overflow: hidden;
        }

        .clock-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 25px;
        }

        .clock {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        /* Wochenplan Fenster */
        .meal-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        iframe.meal-frame {
            width: 100%;
            flex: 1;
            border: none;
            border-radius: 10px;
            background: white; /* Besser lesbar im Plan */
        }

        /* Button Leiste fixiert am unteren Rand */
        .controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 5px 0;
        }

        .smart-btn {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            color: white;
            padding: 18px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
        }

        .smart-btn:active {
            background: var(--accent);
        }
    </style>
</head>
<body>

    <div class="top-row">
        <!-- LINKS: Wetter (jetzt kleiner) -->
        <div class="weather-container">
            <iframe class="ventusky" src="https://www.ventusky.com/?p=48.21;16.37;5&l=temperature-2m"></iframe>
        </div>

        <!-- RECHTS: Uhr & Plan -->
        <div class="info-col">
            <div class="widget clock-box">
                <div class="clock" id="clock">00:00</div>
                <div style="text-align: right; color: #94a3b8;">S8 Dashboard</div>
            </div>

            <div class="widget meal-container">
                <h3 style="margin: 0 0 10px 0; font-size: 1.1rem;">🍴 Küchen-Plan</h3>
                <iframe class="meal-frame" src="https://halkoo.github.io/Einkaufsliste/"></iframe>
            </div>
        </div>
    </div>

    <!-- UNTEN: Buttons (immer im Blick) -->
    <div class="controls">
        <button class="smart-btn" onclick="control('Licht')">💡 Licht</button>
        <button class="smart-btn" onclick="control('Heizung')">🌡️ Heizung</button>
        <button class="smart-btn" onclick="control('TV')">📺 TV</button>
        <button class="smart-btn" onclick="location.reload()">🔄 Refresh</button>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function control(device) {
            console.log(device + " gedrückt");
        }
    </script>
</body>
</html>
