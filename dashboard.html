<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Home Dashboard</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --spotify-green: #1DB954;
        }

        body {
            margin: 0; padding: 25px; height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Segoe UI', sans-serif; color: white;
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            grid-template-rows: auto auto 1fr; /* Wetter kleiner durch auto */
            gap: 25px; overflow: hidden;
            box-sizing: border-box;
        }

        /* UHRZEIT & DATUM */
        .time-box { grid-column: 1; display: flex; flex-direction: column; }
        .clock { font-size: 6rem; font-weight: bold; line-height: 1; margin: 0; }
        .date { font-size: 1.8rem; font-weight: bold; margin-top: 5px; color: #fff; }

        /* BUTTON BEREICH (Wochenplan oben, Spotify darunter) */
        .button-area {
            grid-column: 1; grid-row: 2;
            display: flex; flex-direction: column; gap: 15px;
        }

        .btn {
            border: none; color: white; padding: 20px; border-radius: 20px;
            font-weight: bold; font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .wochenplan-btn { background: #6c5ce7; }
        .spotify-btn { background: var(--spotify-green); }

        /* WETTER (Kleiner) */
        .weather-box {
            grid-column: 1; grid-row: 3;
            background: var(--glass); border-radius: 25px; border: 1px solid var(--glass-border);
            overflow: hidden; position: relative; height: 250px; /* Hier kleiner gestellt */
        }
        .weather-box iframe {
            position: absolute; width: 180%; height: 180%; top: -40%; left: -40%; border: none;
        }

        /* KALENDER */
        .calendar-box {
            grid-column: 2; grid-row: 1 / span 3;
            background: rgba(255,255,255,0.95); border-radius: 30px; 
            padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .calendar-box iframe { width: 100%; height: 100%; border: none; border-radius: 20px; }

        /* OVERLAY */
        #plan-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center;
        }
        .overlay-content { width: 95%; height: 90%; background: #f0f2f5; border-radius: 30px; overflow: hidden; position: relative; }
        .close-btn { position: absolute; top: 20px; right: 20px; padding: 10px 20px; background: #ff7675; color: white; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="time-box">
        <div id="clock" class="clock">--:--</div>
        <div id="date" class="date">Wird geladen...</div>
    </div>

    <div class="button-area">
        <button class="btn wochenplan-btn" onclick="togglePlan(true)">🍴 WOCHENPLAN</button>
        <button class="btn spotify-btn" onclick="window.location.href='spotify:track:set-your-id-here'">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" width="25" height="25"> SPOTIFY
        </button>
    </div>

    <div class="weather-box">
        <iframe src="https://www.ventusky.com/?p=47.7;13.3;5&l=radar"></iframe>
    </div>

    <div class="calendar-box">
        <iframe src="https://calendar.google.com/calendar/embed?src=nomabi3312@gmail.com&src=DEINE_DIENST_ID@group.calendar.google.com&ctz=Europe%2FBerlin&mode=MONTH&showTitle=0&showNav=1&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0"></iframe>
    </div>

    <div id="plan-overlay">
        <div class="overlay-content">
            <button class="close-btn" onclick="togglePlan(false)">Schließen X</button>
            <iframe id="plan-iframe" src="" style="width:100%; height:100%; border:none;"></iframe>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = h + ":" + m;
            
            // Format: 11. Mai 2026
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('de-DE', options);
        }
        setInterval(updateTime, 1000);
        updateTime();

        function togglePlan(show) {
            const overlay = document.getElementById('plan-overlay');
            const iframe = document.getElementById('plan-iframe');
            if(show) {
                iframe.src = "https://halkoo.github.io/HalkooApps/Wochenspeiseplan.html"; 
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
                iframe.src = "";
            }
        }
    </script>
</body>
</html>
