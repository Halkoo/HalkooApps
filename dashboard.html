<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S8 SmartHome Dashboard</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #6c5ce7;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Segoe UI', sans-serif; color: white;
            overflow: hidden; background: #000;
        }

        /* Ventusky Hintergrund */
        .bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }
        iframe.ventusky { width: 100%; height: 100%; border: none; }

        /* Content Layer */
        .content-layer {
            position: relative; z-index: 2;
            display: grid;
            grid-template-columns: 400px 1fr;
            grid-template-rows: 1fr auto;
            gap: 25px;
            height: 100vh;
            padding: 30px;
            box-sizing: border-box;
            background: rgba(0,0,0,0.2); /* Leichte Abdunkelung für bessere Lesbarkeit */
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Widgets */
        .clock { font-size: 5rem; font-weight: bold; margin-bottom: 10px; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        .calendar-container { height: 400px; overflow: hidden; border-radius: 20px; }
        .calendar-container iframe { width: 100%; height: 100%; border: none; filter: invert(0.9) hue-rotate(180deg); } /* Dark Mode Hack für Kalender */

        /* Buttons unten */
        .bottom-bar {
            grid-column: 1 / 3;
            display: flex; gap: 20px; align-items: center;
        }

        .action-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 20px 35px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.3s;
            display: flex; align-items: center; gap: 10px;
        }

        .action-btn.primary { background: var(--accent); border: none; font-size: 1.2rem; }
        .action-btn:active { transform: scale(0.95); }

        /* Wochenplan Overlay (Pop-up) */
        #plan-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .overlay-content {
            width: 90%; height: 90%; background: white; border-radius: 30px; overflow: hidden; position: relative;
        }
        .close-btn {
            position: absolute; top: 20px; right: 20px; background: #ff7675; color: white;
            border: none; padding: 15px 25px; border-radius: 15px; font-weight: bold; z-index: 1001;
        }
    </style>
</head>
<body>

    <!-- Ventusky Live Hintergrund -->
    <div class="bg-layer">
        <iframe class="ventusky" src="https://www.ventusky.com/?p=48.21;16.37;5&l=temperature-2m"></iframe>
    </div>

    <!-- UI Elemente -->
    <div class="content-layer">
        <div class="sidebar">
            <div class="clock" id="clock">00:00</div>
            
            <div class="glass-card">
                <h3 style="margin-top:0">📅 Termine</h3>
                <div class="calendar-container">
                    <!-- Hier deinen Google Kalender Embed Link einfügen -->
                    <iframe src="https://calendar.google.com/calendar/embed?src=DEINE_ID&ctz=Europe%2FBerlin&mode=AGENDA&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0"></iframe>
                </div>
            </div>
        </div>

        <div><!-- Platzhalter Mitte --></div>

        <div class="bottom-bar">
            <!-- DER BUTTON FÜR DEN WOCHENPLAN -->
            <button class="action-btn primary" onclick="togglePlan(true)">🍴 Wochenplan & Einkauf</button>
            
            <button class="action-btn">💡 Licht</button>
            <button class="action-btn">🤖 Roborock</button>
            <button class="action-btn">📺 TV</button>
        </div>
    </div>

    <!-- Das Wochenplan Pop-up -->
    <div id="plan-overlay">
        <button class="close-btn" onclick="togglePlan(false)">X Schließen</button>
        <div class="overlay-content">
            <iframe id="plan-iframe" style="width:100%; height:100%; border:none;"></iframe>
        </div>
    </div>

    <script>
        // Uhrzeit
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Wochenplan Overlay Logik
        function togglePlan(show) {
            const overlay = document.getElementById('plan-overlay');
            const iframe = document.getElementById('plan-iframe');
            if(show) {
                // Hier deinen GitHub Link eintragen (oder den neuen Namen, falls du ihn änderst)
                iframe.src = "https://halkoo.github.io/Einkaufsliste/"; 
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
                iframe.src = "";
            }
        }
    </script>
</body>
</html>
