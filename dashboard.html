<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halkoo Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1c2c;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* LINKS: 35% Breite */
        .side-panel {
            width: 35%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #clock { font-size: 5.5rem; font-weight: bold; margin: 0; letter-spacing: -2px; line-height: 1; }
        #date { font-size: 1.6rem; opacity: 0.8; margin-bottom: 5px; }

        /* WETTER */
        .weather-container {
            flex-grow: 1;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* BUTTONS */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            border-radius: 18px;
            text-align: center;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1.3rem;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        /* Neue Reihenfolge & Farben */
        .btn-smart { background-color: #00a1ff; }   /* Geräte Steuerung Blau */
        .btn-plan { background-color: #6366f1; }    /* Wochenplan Lila */
        .btn-spotify { background-color: #1DB954; } /* Spotify Grün */

        /* RECHTS: 65% Breite (Kalender) */
        .main-panel {
            width: 65%;
            margin-left: 25px;
            background: rgba(255,255,255,0.05);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="side-panel">
        <div id="clock">00:00</div>
        <div id="date">Lädt...</div>

        <div class="weather-container">
            <iframe src="https://www.ventusky.com/?p=47.81;13.04;5&l=radar"></iframe>
        </div>

        <div class="btn-group">
            <a href="https://halkoo.github.io/HalkooApps/Smarthome.html" class="btn btn-smart">📱 GERÄTE STEUERUNG</a>
            
            <a href="https://halkoo.github.io/HalkooApps/Wochenspeiseplan.html" class="btn btn-plan">🍴 WOCHENPLAN</a>
            
            <a href="intent://open#Intent;scheme=spotify;package=com.spotify.music;end" class="btn btn-spotify">🎧 SPOTIFY</a>
        </div>
    </div>

    <div class="main-panel">
        <!-- Anstelle deiner aktuellen Kalender-Kachel -->
<iframe src="https://calendar.google.com/calendar/embed?..." ...></iframe>
    </div>

    <script>
        function update() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = h + ":" + m;
            
            const opt = { weekday: 'long', day: '2-digit', month: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('de-DE', opt);
        }
        setInterval(update, 1000);
        update();

        // Auto-Refresh alle 15 Minuten
        setInterval(() => { location.reload(); }, 900000);

        // Fully Cache beim Laden leeren
        if (typeof fully !== 'undefined') { fully.clearCache(); }
    </script>
</body>
</html>
