<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halkoo Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1c2c;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* LINKE SEITE */
        .left-panel {
            width: 35%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #clock { font-size: 5rem; font-weight: bold; margin: 0; }
        #date { font-size: 1.8rem; margin-bottom: 10px; opacity: 0.9; }

        /* Wetter-Radar (Größe angepasst) */
        .weather-box {
            width: 100%;
            height: 250px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            overflow: hidden;
        }

        /* Buttons unten */
        .btn {
            display: block;
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .btn-plan { background-color: #0000FF; } /* Blau wie im Bild */
        .btn-spotify { background-color: #1DB954; } /* Spotify Grün */

        /* RECHTE SEITE (KALENDER) */
        .right-panel {
            width: 65%;
            margin-left: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 25px;
            overflow: hidden;
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="left-panel">
        <div id="clock">00:00</div>
        <div id="date">Lädt...</div>

        <div class="weather-box">
            <iframe src="https://m.meteo.search.ch/prognosis/widget?name=Salzburg&days=1"></iframe>
        </div>

        <a href="https://halkoo.github.io/Einkaufsliste/index.html" class="btn btn-plan">🍴 WOCHENPLAN</a>
        <a href="spotify:track:0" class="btn btn-spotify">🎧 SPOTIFY</a>
    </div>

    <div class="right-panel">
        <iframe src="https://calendar.google.com/calendar/embed?src=DEINE_EMAIL_HIER&ctz=Europe%2FBerlin&showTitle=0&showCalendars=0&mode=MONTH"></iframe>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}`;
            
            const options = { weekday: 'long', day: '2-digit', month: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('de-DE', options);
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Refresh alle 30 Min gegen Hänger
        setInterval(() => { location.reload(); }, 1800000);
    </script>
</body>
</html>
