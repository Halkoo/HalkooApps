<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    
    <title>Smart Home Dashboard</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0; padding: 20px; height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Segoe UI', sans-serif; color: white;
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            grid-template-rows: auto 1fr 200px; /* Platz für die Smart Life Widgets */
            gap: 20px; overflow: hidden;
            box-sizing: border-box;
        }

        /* 1. UHRZEIT & DATUM */
        .time-box { grid-column: 1; padding: 10px; }
        .clock { font-size: 5.5rem; font-weight: bold; margin: 0; }
        .date { font-size: 1.5rem; opacity: 0.8; }

        /* 2. KALENDER (Rechts) */
        .calendar-box {
            grid-column: 2; grid-row: 1 / span 2;
            background: var(--glass); border-radius: 30px; border: 1px solid var(--glass-border);
            padding: 10px;
        }
        .calendar-box iframe {
            width: 100%; height: 100%; border: none; border-radius: 20px;
            filter: invert(0.9) hue-rotate(180deg) opacity(0.7);
        }

        /* 3. WETTER RADAR (Links unter der Uhr) */
        .weather-box {
            grid-column: 1; grid-row: 2;
            background: var(--glass); border-radius: 30px; border: 1px solid var(--glass-border);
            overflow: hidden; position: relative;
        }
        .weather-box iframe {
            position: absolute; width: 170%; height: 170%; top: -35%; left: -35%; border: none;
        }

        /* 4. UNTERER BEREICH (Wochenplan + Platz für Android-Widgets) */
        .widget-placeholder {
            grid-column: 1 / span 2;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .wochenplan-btn {
            background: #6c5ce7; border: none; color: white;
            padding: 25px 55px; border-radius: 25px; font-weight: bold;
            cursor: pointer; font-size: 1.3rem; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .wochenplan-btn:active { transform: scale(0.95); }

        .widget-info-text {
            color: rgba(255,255,255,0.2); 
            font-size: 0.9rem; 
            font-style: italic;
        }

        /* OVERLAY FÜR WOCHENPLAN */
        #plan-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center;
        }
        .overlay-content { width: 94%; height: 92%; background: white; border-radius: 35px; overflow: hidden; }
    </style>
</head>
<body>

        <div id="clock" class="clock">00:00</div>
        <div id="date">Lade...</div>
    </div>
