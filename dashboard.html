<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <title>Smart Home Dashboard</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0; padding: 20px; height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Segoe UI', sans-serif; color: white;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            grid-template-rows: auto 1fr auto;
            gap: 20px; overflow: hidden;
            box-sizing: border-box;
        }

        /* UHRZEIT */
        .time-box { grid-column: 1; padding: 10px; }
        .clock { font-size: 5rem; font-weight: bold; margin: 0; line-height: 1; }
        .date { font-size: 1.4rem; opacity: 0.8; margin-top: 10px; }

        /* WETTER */
        .weather-box {
            grid-column: 1; grid-row: 2;
            background: var(--glass); border-radius: 25px; border: 1px solid var(--glass-border);
            overflow: hidden; position: relative; min-height: 300px;
        }
        .weather-box iframe {
            position: absolute; width: 180%; height: 180%; top: -40%; left: -40%; border: none;
        }

        /* KALENDER */
        .calendar-box {
            grid-column: 2; grid-row: 1 / span 2;
            background: rgba(255,255,255,0.9); border-radius: 25px; 
            padding: 5px; overflow: hidden;
        }
        .calendar-box iframe {
            width: 100%; height: 100%; border: none; border-radius: 20px;
        }

        /* BUTTONS UNTEN */
        .footer-area {
            grid-column: 1 / span 2;
            display: flex; gap: 20px; align-items: center;
        }

        .wochenplan-btn {
            background: #6c5ce7; border: none; color: white;
            padding: 20px 40px; border-radius: 20px; font-weight: bold;
            cursor: pointer; font-size: 1.2rem;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        }

        /* OVERLAY FÜR WOCHENPLAN */
        #plan-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center;
        }
        .overlay-content { width: 95%; height: 90%; background: white; border-radius: 20px; overflow: hidden; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 15px; padding: 10px 20px; background: #ff7675; color: white; border: none; border-radius: 10px; cursor: pointer; z-index: 1001; }
    </style>
</head>
<body>

    <div class="time-box">
        <div id="clock" class="clock">--:--</div>
        <div id="date" class="date">Wird geladen...</div>
    </div>

    <div class="weather-box">
        <iframe src="https://www.ventusky.com/?p=47.7;13.3;5&l=radar"></iframe>
    </div>

    <div class="calendar-box">
        <iframe src="https://calendar.google.com/calendar/embed?src=nomabi3312@gmail.com&src=HIER_DEINE_DIENST_ID_EINSETZEN&ctz=Europe%2FBerlin&mode=MONTH&showTitle=0&showNav=1&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0"></iframe>
    </div>

    <div class="footer-area">
        <button class="wochenplan-btn" onclick="togglePlan(true)">🍴 WOCHENPLAN</button>
    </div>

    <div id="plan-overlay">
        <div class="overlay-content">
            <button class="close-btn" onclick="togglePlan(false)">Schließen X</button>
            <iframe id="plan-iframe" src="" style="width:100%; height:100%; border:none;"></iframe>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = hours + ":" + minutes;
            
            const options = { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('de-DE', options);
        }
        
        setInterval(updateTime, 1000);
        updateTime();

        function togglePlan(show) {
            const overlay = document.getElementById('plan-overlay');
            const iframe = document.getElementById('plan-iframe');
            if(show) {
                iframe.src = "https://halkoo.github.io/HalkooApps/Wochenspeiseplan.html"; 
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
                iframe.src = "";
            }
        }
    </script>
</body>
</html>
