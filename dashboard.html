<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    
    <title>Smart Home Dashboard</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0; padding: 20px; height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Segoe UI', sans-serif; color: white;
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            grid-template-rows: auto 0.8fr 250px; /* Wetter-Reihe etwas kleiner, Button-Reihe höher */
            gap: 20px; overflow: hidden;
            box-sizing: border-box;
        }

        /* 1. UHRZEIT & DATUM */
        .time-box { grid-column: 1; padding: 10px; }
        .clock { font-size: 6rem; font-weight: bold; margin: 0; line-height: 1; }
        .date { 
            font-size: 2.5rem; /* Größer */
            font-weight: bold; /* Dick wie die Uhr */
            opacity: 1; 
            margin-top: 10px;
            color: #fff;
        }

        /* 2. KALENDER (Rechts) */
        .calendar-box {
            grid-column: 2; grid-row: 1 / span 2;
            background: var(--glass); border-radius: 30px; border: 1px solid var(--glass-border);
            padding: 10px;
        }
        .calendar-box iframe {
            width: 100%; height: 100%; border: none; border-radius: 20px;
            filter: invert(0.9) hue-rotate(180deg) opacity(0.7);
        }

        /* 3. WETTER RADAR (Kleiner gemacht) */
        .weather-box {
            grid-column: 1; grid-row: 2;
            background: var(--glass); border-radius: 30px; border: 1px solid var(--glass-border);
            overflow: hidden; position: relative;
            max-height: 350px; /* Begrenzt die Höhe des Wetterfensters */
        }
        .weather-box iframe {
            position: absolute; width: 180%; height: 180%; top: -40%; left: -40%; border: none;
        }

        /* 4. UNTERER BEREICH (Buttons) */
        .widget-placeholder {
            grid-column: 1 / span 2;
            display: flex;
            flex-direction: column; /* Buttons untereinander */
            align-items: flex-start;
            gap: 15px;
            padding-top: 20px;
        }

        .btn {
            border: none; color: white;
            padding: 20px 50px; border-radius: 20px; font-weight: bold;
            cursor: pointer; font-size: 1.2rem; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            width: 300px; /* Einheitliche Breite */
            text-align: center;
        }
        
        .wochenplan-btn { background: #6c5ce7; }
        .spotify-btn { 
            background: #1DB954; /* Spotify Grün */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:active { transform: scale(0.95); }

        /* OVERLAY FÜR WOCHENPLAN */
        #plan-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center;
        }
        .overlay-content { width: 94%; height: 92%; background: white; border-radius: 35px; overflow: hidden; }
    </style>
</head>
<body>

    <div class="time-box">
        <div id="clock" class="clock">00:00</div>
        <div id="date" class="date">Lade...</div>
    </div>

    <div class="weather-box">
        <iframe src="https://www.ventusky.com/?p=47.7;13.3;5&l=radar"></iframe>
    </div>

    <div class="calendar-box">
        <iframe src="https://calendar.google.com/calendar/embed?src=nomabi3312@gmail.com&ctz=Europe%2FBerlin&mode=MONTH&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0"></iframe>
    </div>

    <div class="widget-placeholder">
        <button class="btn wochenplan-btn" onclick="togglePlan(true)">🍴 WOCHENPLAN</button>
        <button class="btn spotify-btn" onclick="window.location.href='spotify:track:7qiZ3oTQuZzyuS099q9S3S'">🎵 SPOTIFY</button>
    </div>

    <div id="plan-overlay">
        <button style="position:absolute; top:25px; right:25px; padding:15px 25px; background:#ff7675; color:white; border:none; border-radius:15px; font-weight:bold;" onclick="togglePlan(false)">Schließen X</button>
        <div class="overlay-content">
            <iframe id="plan-iframe" src="" style="width:100%; height:100%; border:none;"></iframe>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            // Uhrzeit
            document.getElementById('clock').innerText = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            
            // Datum Format: 11. Mai 2026
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('de-DE', options);
        }
        setInterval(updateTime, 1000);
        updateTime();

        function togglePlan(show) {
            const overlay = document.getElementById('plan-overlay');
            const iframe = document.getElementById('plan-iframe');
            if(show) {
                iframe.src = "https://halkoo.github.io/HalkooApps/Wochenspeiseplan.html"; 
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
                iframe.src = "";
            }
        }
    </script>
</body>
</html>
