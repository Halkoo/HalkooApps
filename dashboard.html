<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S8 Home Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            height: 100vh;
            box-sizing: border-box;
            /* Der bunte Hintergrund wie im Bild */
            background: linear-gradient(135deg, #1e3a8a, #7e22ce, #be185d);
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 40px;
        }

        /* Glaseffekt für die Kacheln */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Linke Spalte: Uhr & Wetter */
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        
        .clock {
            font-size: 5rem;
            font-weight: bold;
            margin: 20px 0;
            text-align: left;
        }

        .weather-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .weather-day { text-align: center; font-size: 0.9rem; }
        .weather-day img { width: 40px; display: block; margin: 5px auto; }

        /* Rechte Seite: Kategorien & Buttons */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        h2 { font-size: 1.2rem; margin-bottom: 15px; opacity: 0.9; }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .smart-item {
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .smart-item:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.3); }
        
        .smart-item i { font-size: 2rem; margin-bottom: 10px; }
        .smart-item span { font-size: 0.8rem; font-weight: bold; text-align: center; }

        /* Wochenplan Integration */
        .plan-box {
            grid-column: span 2;
            height: 300px;
            overflow: hidden;
        }

        iframe { width: 100%; height: 100%; border: none; border-radius: 15px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="clock" id="clock">10:33</div>
        
        <div class="glass-card">
            <h2>Wetter</h2>
            <div class="weather-row">
                <div class="weather-day">SO<br>☀️<br>20°</div>
                <div class="weather-day">MO<br>☁️<br>18°</div>
                <div class="weather-day">DI<br>🌧️<br>16°</div>
                <div class="weather-day">MI<br>☀️<br>19°</div>
                <div class="weather-day">DO<br>⛅<br>19°</div>
            </div>
        </div>

        <div class="glass-card" style="margin-top: auto; font-size: 0.9rem;">
            <span>🎵 Spotify: <b>A Long Fall</b></span>
        </div>
    </div>

    <div class="main-content">
        <!-- Sektion Licht -->
        <div>
            <h2>Licht</h2>
            <div class="button-grid">
                <div class="smart-item">💡<span>Küche</span></div>
                <div class="smart-item">💡<span>Wohnzimmer</span></div>
                <div class="smart-item">💡<span>Flur</span></div>
            </div>
        </div>

        <!-- Sektion Geräte -->
        <div>
            <h2>Geräte</h2>
            <div class="button-grid">
                <div class="smart-item">🤖<span>Roborock</span></div>
                <div class="smart-item">📺<span>TV</span></div>
                <div class="smart-item">🌡️<span>Heizung</span></div>
            </div>
        </div>

        <!-- Deine Küchen-App als große Kachel -->
        <div class="glass-card plan-box">
            <h2>🍴 Unser Wochenplan</h2>
            <iframe src="https://halkoo.github.io/Einkaufsliste/"></iframe>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
