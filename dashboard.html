<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <title>Smart Home Dashboard</title>
    <style>
        :root { 
            --glass: rgba(255, 255, 255, 0.1); 
            --glass-border: rgba(255, 255, 255, 0.2); 
            --spotify-green: #1DB954;
        }

        body { 
            margin: 0; padding: 20px; height: 100vh; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            font-family: 'Segoe UI', sans-serif; color: white; 
            display: grid; 
            grid-template-columns: 1fr 1.4fr; 
            grid-template-rows: auto auto 1fr; /* Angepasst für kleinere Wetter-Box */
            gap: 20px; overflow: hidden; box-sizing: border-box; 
        }

        /* 1. UHRZEIT & DATUM */
        .time-box { grid-column: 1; padding: 10px; display: flex; flex-direction: column; }
        .clock { font-size: 6.5rem; font-weight: bold; margin: 0; line-height: 1; }
        .date { 
            font-size: 2.2rem; /* Größer */
            font-weight: 800; /* Fett */
            margin-top: 10px; 
            color: #a29bfe; 
            letter-spacing: 1px;
        }

        /* 2. KALENDER */
        .calendar-box { 
            grid-column: 2; grid-row: 1 / span 3; 
            background: var(--glass); border-radius: 30px; border: 1px solid var(--glass-border); 
            padding: 10px; overflow: hidden; 
        }
        .calendar-box iframe { width: 100%; height: 100%; border: none; border-radius: 20px; filter: invert(0.9) hue-rotate(180deg) opacity(0.85); }

        /* 3. WETTER RADAR (Kleiner) */
        .weather-box { 
            grid-column: 1; grid-row: 2; 
            height: 250px; /* Festgelegte kleinere Höhe */
            background: var(--glass); border-radius: 30px; border: 1px solid var(--glass-border); 
            overflow: hidden; position: relative; 
        }
        .weather-box iframe { position: absolute; width: 180%; height: 180%; top: -40%; left: -40%; border: none; }

        /* 4. BUTTON BEREICH (Wochenplan & Spotify) */
        .button-area { 
            grid-column: 1; grid-row: 3; 
            display: flex; flex-direction: column; 
            gap: 15px; justify-content: flex-start; padding-top: 10px;
        }

        .btn { 
            border: none; color: white; padding: 18px; 
            border-radius: 20px; font-weight: bold; cursor: pointer; 
            font-size: 1.1rem; text-align: center; text-decoration: none;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }

        .wochenplan-btn { background: #6c5ce7; width: 100%; }
        .spotify-btn { 
            background: var(--spotify-green); 
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        /* OVERLAY FÜR WOCHENPLAN */
        #plan-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .overlay-content { width: 95%; height: 90%; background: white; border-radius: 30px; overflow: hidden; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 15px; padding: 10px 20px; background: #ff7675; color: white; border: none; border-radius: 10px; cursor: pointer; z-index: 1100; }
    </style>
</head>
<body>

    <div class="time-box">
        <div id="clock" class="clock">00:00</div>
        <div id="date" class="date">Wird geladen...</div>
    </div>

    <div class="weather-box">
        <iframe src="https://www.ventusky.com/?p=47.7;13.3;5&l=radar"></iframe>
    </div>

    <div class="calendar-box">
        <iframe src="https://calendar.google.com/calendar/embed?src=nomabi3312@gmail.com&src=c366726f2240200ceddc4682c9f164245967bcd7cb235ea9d8dad27f9fa8ee82@group.calendar.google.com&ctz=Europe%2FBerlin&mode=MONTH&showTitle=0&showNav=1&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0"></iframe>
    </div>

    <div class="button-area">
        <button class="btn wochenplan-btn" onclick="togglePlan(true)">🍴 WOCHENPLAN</button>
