<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halkoo Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1c2c;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* LINKE SEITE (35%) */
        .left-panel {
            width: 35%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #clock { font-size: 5.5rem; font-weight: bold; margin: 0; letter-spacing: -2px; }
        #date { font-size: 1.8rem; margin-bottom: 5px; opacity: 0.8; }

        /* VENTUSKY WETTER BOX */
        .weather-box {
            width: 100%;
            flex-grow: 1; /* Füllt den Platz bis zu den Buttons aus */
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 10px;
        }

        /* BUTTONS UNTEN */
        .btn {
            display: block;
            width: 100%;
            padding: 22px;
            border-radius: 18px;
            text-align: center;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1.4rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-plan { background-color: #6366f1; } /* Dein Lila vom Wochenplan */
        .btn-spotify { background-color: #1DB954; }

        /* RECHTE SEITE (65% - KALENDER) */
        .right-panel {
            width: 65%;
            margin-left: 25px;
            background: rgba(255,255,255,0.05);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="left-panel">
        <div id="clock">00:00</div>
        <div id="date">Lädt...</div>

        <div class="weather-box">
            <iframe src="https://www.ventusky.com/?p=47.81;13.04;5&l=radar"></iframe>
        </div>

        <a href="https://halkoo.github.io/HalkooApps/Wochenspeiseplan.html" class="btn btn-plan">🍴 WOCHENPLAN</a>
        <a href="spotify:track:0" class="btn btn-spotify">🎧 SPOTIFY</a>
    </div>

    <div class="right-panel">
        <iframe src="https://calendar.google.com/calendar/embed?src=nomabi3312@gmail.com&ctz=Europe%2FBerlin&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0"></iframe>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = h + ":" + m;
            
            const options = { weekday: 'long', day: '2-digit', month: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('de-DE', options);
        }

        // Uhr jede Sekunde updaten
        setInterval(updateTime, 1000);
        updateTime();

        // Alle 30 Minuten Refresh für die ganze Seite (gegen Hänger)
        setInterval(() => { 
            location.reload(); 
        }, 1800000);

        // Fully Cache leeren beim Start
        if (typeof fully !== "undefined") {
            fully.clearCache();
        }
    </script>
</body>
</html>
