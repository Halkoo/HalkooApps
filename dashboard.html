<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Halkoo Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1c2c;
            color: white;
            margin: 0;
            padding: 15px;
            display: flex;
            height: 100vh;
            overflow: hidden; /* Verhindert Scrollen auf dem Tablet */
        }

        /* LINKS: 35% Breite */
        .side-panel {
            width: 35%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }

        /* Etwas kompakter, um Platz fürs Wetter zu schaffen */
        #clock { font-size: 4.8rem; font-weight: bold; margin: 0; letter-spacing: -2px; line-height: 0.95; }
        #date { font-size: 1.3rem; opacity: 0.8; margin-bottom: 0px; }

        /* WETTER - Nutzt den Platz optimal aus */
        .weather-container {
            flex-grow: 1;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        /* Vergrößert die Wetter-Anzeige (Zoom), ohne das Layout zu sprengen */
        .weather-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            transform: scale(1.15); /* Vergrößert die Karte im Rahmen um 15% */
            transform-origin: center;
        }

        /* BUTTONS */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px; 
            border-radius: 18px;
            text-align: center;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.1s ease;
        }
        
        .btn:active { transform: scale(0.97); }

        .btn-smart { background-color: #00a1ff; }   /* Geräte Steuerung Blau */
        .btn-plan { background-color: #6366f1; }     /* Wochenplan Lila */
        .btn-flash { background-color: #2ecc71; }    /* Flash Maker Grün */

        /* RECHTS: 65% Breite (Kalender) */
        .main-panel {
            width: 65%;
            margin-left: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            height: 100%;
        }

        .main-panel iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="side-panel">
        <div id="clock">00:00</div>
        <div id="date">Lädt...</div>

        <div class="weather-container">
            <iframe src="https://www.ventusky.com/?p=47.81;13.04;6&l=radar"></iframe>
        </div>

        <div class="btn-group">
            <a href="https://halkoo.github.io/HalkooApps/Smarthome.html" class="btn btn-smart">📱 GERÄTE STEUERUNG</a>
            <a href="https://halkoo.github.io/HalkooApps/Wochenspeiseplan.html" class="btn btn-plan">🍴 WOCHENPLAN</a>
            <a href="intent://open#Intent;scheme=flashmaker;package=com.ly.flashmaker;end" class="btn btn-flash">⚡ FLASH MAKER</a>
        </div>
    </div>

    <div class="main-panel">
        <iframe src="https://calendar.google.com/calendar/embed?src=nomabi3312%40gmail.com&ctz=Europe%2FBerlin&mode=MONTH&showTitle=0&showPrint=0&showTabs=1&showCalendars=0&showTz=0" 
                scrolling="no">
        </iframe>
    </div>

    <script>
        function update() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = h + ":" + m;
            
            const opt = { weekday: 'long', day: '2-digit', month: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('de-DE', opt);
        }
        setInterval(update, 1000);
        update();

        // Auto-Refresh alle 15 Minuten
        setInterval(() => { location.reload(); }, 900000);

        // Fully Cache beim Laden leeren
        if (typeof fully !== 'undefined') { fully.clearCache(); }
    </script>
</body>
</html>
