<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S8 SmartHome Dashboard</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #6c5ce7;
        }

        body {
            margin: 0;
            padding: 25px;
            height: 100vh;
            box-sizing: border-box;
            background: linear-gradient(145deg, #1e3a8a 0%, #7e22ce 50%, #be185d 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            display: grid;
            grid-template-columns: 500px 1fr; 
            grid-template-rows: 1fr auto;
            gap: 20px;
            overflow: hidden;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        .time-container { margin-bottom: 10px; }
        .clock { font-size: 5rem; font-weight: bold; line-height: 1; }
        .date { font-size: 1.5rem; opacity: 0.9; margin-top: 5px; color: #e0e0e0; }

        .weather-widget {
            flex-grow: 1;
            min-height: 450px; 
            padding: 0 !important;
            overflow: hidden;
        }

        .weather-widget iframe {
           position: absolute;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 30px;
        }

        .calendar-container {
            height: 75%; /* Kalender etwas kompakter */
            align-self: flex-start;
        }

        .calendar-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 20px;
            /* Dark Mode Filter für den Kalender */
            filter: invert(0.9) hue-rotate(180deg) opacity(0.8);
        }

        .bottom-bar {
            grid-column: 1 / 3;
            display: flex;
            gap: 15px;
        }

        .action-btn {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 18px 30px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-plan { background: var(--accent); border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .action-btn:active { transform: scale(0.95); }

        #plan-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center;
        }

        .overlay-content { width: 92%; height: 92%; background: white; border-radius: 35px; overflow: hidden; position: relative; }
        
        .close-btn {
            position: absolute; top: 20px; right: 20px; background: #ff7675; color: white;
            border: none; padding: 15px 25px; border-radius: 15px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="time-container">
            <div id="clock" class="clock">00:00</div>
            <div id="date" class="date">Wochentag, 01. Januar</div>
        </div>
        
        <div class="glass-card weather-widget">
            <!-- Ventusky Widget -->
            <iframe src="https://www.ventusky.com/?p=48.21;16.37;5&l=temperature-2m"></iframe>
        </div>
    </div>

    <div class="main-content">
        <div class="glass-card calendar-container">
            <h3 style="margin-top: 0;">📅 Termine</h3>
            <!-- Dein Google Kalender Link (öffentlich geschaltet) -->
            <iframe src="https://calendar.google.com/calendar/embed?src=nomabi3312@gmail.com&ctz=Europe%2FBerlin&mode=MONTH&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0"></iframe>
        </div>
    </div>

    <div class="bottom-bar">
        <button class="action-btn btn-plan" onclick="togglePlan(true)">🍴 Wochenplan & Einkauf</button>
        <button class="action-btn" onclick="control('licht')">💡 Licht</button>
        <button class="action-btn" onclick="control('tuer')">🔓 SwitchBot Schloss</button>
        <button class="action-btn" onclick="control('heizung')">🌡️ Heizung</button>
    </div>

    <div id="plan-overlay">
        <button class="close-btn" onclick="togglePlan(false)">Schließen</button>
        <div class="overlay-content">
            <!-- Dein Wochenplan Link -->
            <iframe id="plan-iframe" src="" style="width:100%; height:100%; border:none;"></iframe>
        </div>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            const options = { weekday: 'long', day: '2-digit', month: 'long' };
            document.getElementById('date').innerText = now.toLocaleDateString('de-DE', options);
        }
        
        setInterval(updateDateTime, 1000);
        updateDateTime();

        function togglePlan(show) {
            const overlay = document.getElementById('plan-overlay');
            const iframe = document.getElementById('plan-iframe');
            if(show) {
                iframe.src = "https://halkoo.github.io/HalkooApps/Wochenspeiseplan.html"; 
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
                iframe.src = "";
            }
        }

        function control(device) {
            console.log("Alexa-Befehl für: " + device);
            // Hier fügst du später deine Virtual-Button URLs ein
        }
    </script>
</body>
</html>
