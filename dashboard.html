<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S8 SmartHome Dashboard</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #6c5ce7;
            --danger: #ff7675;
        }

        body {
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            background: linear-gradient(145deg, #1e3a8a 0%, #7e22ce 50%, #be185d 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            display: grid;
            /* Links 35% (Zeit, Wetter, Knöpfe), Rechts 65% (Kalender) */
            grid-template-columns: 35% 1fr;
            gap: 20px;
            overflow: hidden;
        }

        /* Container Links */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        /* Zeit & Datum */
        .time-container { padding: 10px; }
        .clock { font-size: 5rem; font-weight: bold; line-height: 1; }
        .date { font-size: 1.5rem; opacity: 0.8; margin-top: 5px; }

        /* Wetter-Fokus auf Österreich (Zoom & Position) */
        .weather-widget {
            height: 300px; /* Wetter etwas kleiner */
            padding: 0 !important;
            overflow: hidden;
            position: relative;
        }

        .weather-widget iframe {
            position: absolute;
            width: 180% !important; 
            height: 180% !important;
            /* Österreich zentrieren */
            top: -45%; 
            left: -40%; 
            border: none;
        }

        /* Button Bereich Links */
        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
        }

        .action-btn {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 22px; /* Größere Buttons */
            border-radius: 22px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: 0.2s;
        }

        .action-btn:active { transform: scale(0.96); }
        .btn-plan { background: var(--accent); border: none; margin-top: 5px; }

        /* Kalender Rechts (Monatsansicht) */
        .calendar-container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .calendar-container iframe {
            flex-grow: 1;
            width: 100%;
            border: none;
            border-radius: 20px;
            /* Dark Mode Filter */
            filter: invert(0.9) hue-rotate(180deg) opacity(0.8);
        }

        /* Wochenplan Overlay */
        #plan-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center;
        }

        .overlay-content { width: 95%; height: 95%; background: white; border-radius: 30px; overflow: hidden; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: var(--danger); color: white; border: none; padding: 15px 25px; border-radius: 12px; font-weight: bold; cursor: pointer; z-index: 1001; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="time-container">
            <div id="clock" class="clock">00:00</div>
            <div id="date" class="date">Wochentag, 01. Jan</div>
        </div>

        <div class="glass-card weather-widget">
            <iframe src="https://www.ventusky.com/?p=47.6;14.2;7&l=temperature-2m"></iframe>
        </div>

        <div class="button-grid">
            <button class="action-btn" onclick="control('licht')">💡 Licht Alexa</button>
            <button class="action-btn" onclick="control('tuer')">🔓 Schloss Alexa</button>
            <button class="action-btn" onclick="control('heizung')">🌡️ Heizung Alexa</button>
            <button class="action-btn btn-plan" onclick="togglePlan(true)">🍴 Wochenplan</button>
        </div>
    </div>

    <div class="main-content calendar-container glass-card">
        <h3 style="margin: 0 0 10px 0;">📅 Monatsplan</h3>
        <iframe src="https://calendar.google.com/calendar/embed?src=halkoo%40gmail.com&ctz=Europe%2FBerlin&mode=MONTH&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0"></iframe>
    </div>

    <div id="plan-overlay">
        <button class="close-btn" onclick="togglePlan(false)">X Schließen</button>
        <div class="overlay-content">
            <iframe id="plan-iframe" src="" style="width:100%; height:100%; border:none;"></iframe>
        </div>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('date').innerText = now.toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: 'long' });
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        function togglePlan(show) {
            const overlay = document.getElementById('plan-overlay');
            const iframe = document.getElementById('plan-iframe');
            if(show) {
                iframe.src = "https://halkoo.github.io/Wochenplan/"; 
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
                iframe.src = "";
            }
        }

        function control(device) {
            console.log("Befehl an Alexa: " + device);
            // Hier kommt später der Link zu IFTTT oder deinem Alexa-Skill rein
        }
    </script>
</body>
</html>
