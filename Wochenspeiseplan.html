<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Küchen-App All-In-One</title>
    <style>
        :root {
            --primary-lila: #6c5ce7;
            --secondary-green: #63b39d;
            --bg-color: #f0f2f5;
            --text-dark: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--text-dark); margin-bottom: 20px; }

        /* Header Button */
        .open-list-btn {
            background-color: var(--secondary-green);
            color: white;
            width: 100%;
            max-width: 500px;
            text-align: center;
            padding: 18px;
            border-radius: 15px;
            border: none;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Wochenplan Karten */
        #plan-container { width: 100%; max-width: 500px; }

        .card {
            background: white;
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-left: 15px solid var(--primary-lila);
            box-sizing: border-box;
        }

        .tag-name {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--primary-lila);
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .label { font-size: 0.75rem; font-weight: bold; color: #e67e22; margin-top: 12px; text-transform: uppercase; }
        .meal-text { font-size: 1.25rem; font-weight: 600; color: var(--text-dark); margin-top: 4px; }

        /* Anleitung klappbar */
        .details { display: none; margin-top: 15px; padding: 10px; background: #f9f9f9; border-radius: 10px; font-size: 0.95rem; color: #555; line-height: 1.4; }

        .recipe-btn {
            display: block; width: 100%; background: white; border: 2px solid var(--primary-lila);
            color: var(--primary-lila); padding: 10px; border-radius: 12px; margin-top: 15px;
            text-align: center; font-weight: bold; cursor: pointer;
        }

        /* OVERLAY SYSTEM */
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .overlay-content {
            background: white;
            width: 90%;
            max-width: 450px;
            max-height: 85vh;
            border-radius: 25px;
            padding: 25px;
            overflow-y: auto;
            position: relative;
            border-left: 15px solid var(--secondary-green);
            box-sizing: border-box;
        }

        .close-btn {
            background: #ff7675;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            float: right;
            cursor: pointer;
        }

        /* Einkaufsliste Zeilen */
        .item-row {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f2f5;
            cursor: pointer;
        }

        .checkbox { width: 22px; height: 22px; border: 2px solid var(--secondary-green); border-radius: 6px; margin-right: 15px; flex-shrink: 0; }
        .done .checkbox { background-color: var(--secondary-green); }
        .done .item-text { text-decoration: line-through; color: #b2bec3; }
        .item-text { font-size: 1.1rem; color: var(--text-dark); }
