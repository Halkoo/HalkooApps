<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wochenplan</title>
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .einkauf-btn {
            background-color: #63b39d;
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 10px solid #6c5ce7;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .tag-header {
            font-size: 1.4rem;
            font-weight: bold;
            color: #6c5ce7;
            margin-bottom: 10px;
            border-bottom: 1px solid #f0f2f5;
            padding-bottom: 5px;
        }

        .label {
            font-size: 0.75rem;
            color: #e67e22;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .content {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2d3436;
        }

        .recipe-btn {
            display: block;
            margin-top: 15px;
            padding: 10px;
            text-align: center;
            border: 2px solid #6c5ce7;
            color: #6c5ce7;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <a href="Einkaufsliste.html" class="einkauf-btn">🛒 ZUR EINKAUFSLISTE</a>

    <div class="container" id="plan-container">
        </div>

    <script>
        // DEINE TABELLEN-ID (die aus deinem Link von vorhin)
        const sheetId = '1vVp1w07pE9kX57M-L8vXoU5O5XU-m1I8hXN9XF5XWk8';
        const base = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

        fetch(base)
            .then(res => res.text())
            .then(data => {
                const json = JSON.parse(data.substr(47).slice(0, -2));
                const rows = json.table.rows;
                const container = document.getElementById('plan-container');
                container.innerHTML = '';

                rows.forEach(row => {
                    const tag = row.c[0] ? row.c[0].v : '';
                    const haupt = row.c[1] ? row.c[1].v : '';
                    const nach = row.c[2] ? row.c[2].v : '';

                    if(tag && tag !== "Tag") {
                        const card = `
                            <div class="card">
                                <div class="tag-header">${tag}</div>
                                <div class="label">HAUPTSPEISE</div>
                                <div class="content">${haupt}</div>
                                <div class="label">NACHSPEISE</div>
                                <div class="content">${nach}</div>
                                <a href="#" class="recipe-btn">ANLEITUNG ANZEIGEN</a>
                            </div>
                        `;
                        container.innerHTML += card;
                    }
                });
            })
            .catch(err => console.error("Fehler beim Laden:", err));
    </script>
</body>
</html>
